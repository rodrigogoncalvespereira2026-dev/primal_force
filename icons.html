<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Primal Force — Ícones de Moeda e Jóia</title>
<style>
  body { background:#1a1008; display:flex; gap:60px; align-items:center; justify-content:center; height:100vh; margin:0; font-family:sans-serif; }
  .item { text-align:center; }
  .item span { color:#c9a227; font-size:12px; display:block; margin-top:10px; }
</style>
</head>
<body>

<div class="item">
  <!-- MOEDA -->
  <svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="coinFace" cx="35%" cy="30%" r="75%">
        <stop offset="0%" stop-color="#F5DA8C"/>
        <stop offset="45%" stop-color="#D4AF37"/>
        <stop offset="100%" stop-color="#8B6914"/>
      </radialGradient>
      <linearGradient id="coinRim" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#F5DA8C"/>
        <stop offset="100%" stop-color="#6B4E10"/>
      </linearGradient>
    </defs>
    <!-- rim (edge, gives thickness illusion) -->
    <circle cx="60" cy="63" r="52" fill="url(#coinRim)"/>
    <!-- face -->
    <circle cx="60" cy="58" r="52" fill="url(#coinFace)" stroke="#5C420C" stroke-width="2"/>
    <!-- inner bevel ring -->
    <circle cx="60" cy="58" r="43" fill="none" stroke="#8B6914" stroke-width="2" opacity="0.6"/>
    <circle cx="60" cy="58" r="43" fill="none" stroke="#FFF3C4" stroke-width="1" opacity="0.5" transform="translate(-1,-1)"/>
    <!-- espiral Primal gravada (mesmo motivo da Gota Primordial) -->
    <path d="M60 30
             C74 30 84 40 84 54
             C84 65 76 73 66 73
             C58 73 52 67 52 59
             C52 53 57 49 62 49
             C66 49 69 52 69 56"
          fill="none" stroke="#5C420C" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
    <circle cx="69" cy="56" r="3.2" fill="#5C420C" opacity="0.85"/>
    <!-- highlight -->
    <ellipse cx="42" cy="38" rx="16" ry="9" fill="#FFF6DC" opacity="0.35" transform="rotate(-20 42 38)"/>
  </svg>
  <span>MOEDA · comum</span>
</div>

<div class="item">
  <!-- JÓIA -->
  <svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="gemTop" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#E3B8FF"/>
        <stop offset="100%" stop-color="#8B4FD6"/>
      </linearGradient>
      <linearGradient id="gemLeft" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#B478E8"/>
        <stop offset="100%" stop-color="#5B2A9E"/>
      </linearGradient>
      <linearGradient id="gemRight" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#7A3FC4"/>
        <stop offset="100%" stop-color="#3D1B6E"/>
      </linearGradient>
    </defs>
    <!-- corte hexagonal facetado, estilo pedra preciosa -->
    <polygon points="60,14 84,32 84,60 60,106 36,60 36,32" fill="url(#gemTop)" opacity="0"/>
    <!-- faceta superior -->
    <polygon points="60,14 84,32 60,46 36,32" fill="url(#gemTop)" stroke="#3D1B6E" stroke-width="1.5"/>
    <!-- faceta esquerda -->
    <polygon points="36,32 60,46 60,106 42,66" fill="url(#gemLeft)" stroke="#3D1B6E" stroke-width="1.5"/>
    <!-- faceta direita -->
    <polygon points="84,32 60,46 60,106 78,66" fill="url(#gemRight)" stroke="#3D1B6E" stroke-width="1.5"/>
    <!-- linha central de brilho -->
    <line x1="60" y1="46" x2="60" y2="106" stroke="#E3B8FF" stroke-width="1" opacity="0.4"/>
    <!-- brilho pontual -->
    <polygon points="52,26 60,22 68,26 60,32" fill="#FFFFFF" opacity="0.55"/>
    <!-- glow externo (para animar/pulsar no jogo via CSS) -->
    <polygon points="60,14 84,32 84,60 60,106 36,60 36,32" fill="none" stroke="#E3B8FF" stroke-width="1" opacity="0.25"/>
  </svg>
  <span>JÓIA · premium</span>
</div>

</body>
</html>
