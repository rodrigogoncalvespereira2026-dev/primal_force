<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a1a">
    <title>Primal Force — Roda de Invocação</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --power-dark: #0a0a1a; --power-gold: #FFD700; }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--power-dark);
            color: #e8e8f0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background-image:
                radial-gradient(ellipse at center, rgba(255,215,0,0.04) 0%, transparent 55%),
                linear-gradient(rgba(255,215,0,0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,215,0,0.015) 1px, transparent 1px);
            background-size: 100% 100%, 45px 45px, 45px 45px;
            user-select: none; -webkit-user-select: none;
        }

        .header {
            position: fixed; top: 0; left: 0; right: 0;
            padding: 14px 20px;
            display: flex; align-items: center; gap: 12px;
            background: rgba(10,10,26,0.92);
            border-bottom: 1px solid rgba(255,215,0,0.1);
            z-index: 50;
        }
        .header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 13px; font-weight: 700;
            letter-spacing: 0.1em; color: var(--power-gold);
        }
        .header a {
            margin-left: auto;
            font-family: 'Orbitron', sans-serif;
            font-size: 10px; font-weight: 700;
            color: var(--power-gold); text-decoration: none;
            padding: 7px 14px;
            border: 1px solid rgba(255,215,0,0.25);
            border-radius: 4px; transition: all 0.2s;
        }
        .header a:hover { background: rgba(255,215,0,0.1); }

        /* Wheel wrapper */
        .wheel-wrapper {
            position: relative;
            width: 360px; height: 360px;
            display: flex; align-items: center; justify-content: center;
        }

        /* Outer ring glow */
        .wheel-wrapper::before {
            content: '';
            position: absolute;
            width: 340px; height: 340px;
            border-radius: 50%;
            border: 2px solid rgba(255,215,0,0.12);
            box-shadow: 0 0 30px rgba(255,215,0,0.06), inset 0 0 30px rgba(255,215,0,0.04);
        }

        /* The spinning disc */
        .wheel-disc {
            position: absolute;
            width: 300px; height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(20,20,50,0.9) 0%, rgba(10,10,26,0.95) 70%);
            border: 1px solid rgba(255,215,0,0.1);
            transition: none;
        }
        .wheel-disc.spinning {
            transition: none;
        }

        /* Robot icons on the disc */
        .wheel-icon {
            position: absolute;
            width: 52px; height: 52px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            border: 2px solid transparent;
            background: rgba(15,15,35,0.95);
            font-size: 10px; font-weight: 800;
            font-family: 'Orbitron', sans-serif;
            color: #fff;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .wheel-icon img {
            width: 100%; height: 100%;
            border-radius: 50%; object-fit: cover;
        }
        .wheel-icon.active {
            border-color: var(--power-gold) !important;
            box-shadow: 0 0 15px var(--power-gold), 0 0 30px rgba(255,215,0,0.3);
        }

        /* Pointer / selector at top */
        .selector {
            position: absolute;
            top: -8px;
            width: 0; height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-top: 22px solid var(--power-gold);
            filter: drop-shadow(0 0 8px rgba(255,215,0,0.5));
            z-index: 20;
        }
        .selector-glow {
            position: absolute;
            top: -14px; left: -18px;
            width: 36px; height: 30px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,215,0,0.3), transparent);
            z-index: 19;
            animation: selectorPulse 1.5s ease-in-out infinite;
        }
        @keyframes selectorPulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* Center hub */
        .center-hub {
            position: absolute;
            width: 80px; height: 80px;
            border-radius: 50%;
            background: radial-gradient(circle, #fff 0%, #c0c0c0 30%, #606060 70%, #303030 100%);
            box-shadow: 0 0 20px rgba(255,255,255,0.2), 0 0 40px rgba(255,215,0,0.15);
            display: flex; align-items: center; justify-content: center;
            z-index: 10;
        }
        .center-hub::before {
            content: '';
            position: absolute; inset: -5px;
            border-radius: 50%;
            border: 1.5px solid rgba(255,215,0,0.2);
        }
        .center-symbol {
            font-size: 28px;
            filter: drop-shadow(0 0 6px rgba(255,215,0,0.4));
        }

        /* Info panel */
        .info-panel {
            position: absolute;
            bottom: -70px;
            text-align: center;
            width: 100%;
        }
        .info-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px; font-weight: 900;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            transition: color 0.2s;
        }
        .info-sub {
            font-size: 12px;
            color: rgba(255,255,255,0.45);
            margin-top: 2px;
        }
        .info-hint {
            font-size: 11px;
            color: rgba(255,255,255,0.25);
            margin-top: 8px;
            animation: hintPulse 2s ease-in-out infinite;
        }
        .info-hint.spinning { display: none; }
        @keyframes hintPulse {
            0%, 100% { opacity: 0.25; }
            50% { opacity: 0.6; }
        }

        /* Spin button */
        .spin-btn {
            position: absolute;
            bottom: -120px;
            padding: 14px 44px;
            background: linear-gradient(135deg, var(--power-gold), #FFA000);
            color: #0a0a1a; border: none; border-radius: 6px;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px; font-weight: 800;
            letter-spacing: 0.12em; text-transform: uppercase;
            cursor: pointer; transition: all 0.3s;
            box-shadow: 0 4px 20px rgba(255,215,0,0.3);
        }
        .spin-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 30px rgba(255,215,0,0.5); }
        .spin-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

        /* Reveal overlay */
        .reveal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0);
            display: none; align-items: center; justify-content: center;
            z-index: 100;
            transition: background 0.4s;
        }
        .reveal-overlay.ativo {
            display: flex;
            background: rgba(0,0,0,0.85);
        }
        .reveal-card {
            text-align: center;
            animation: revealPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .reveal-avatar {
            width: 120px; height: 120px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 16px;
            font-size: 48px; font-weight: 900;
            font-family: 'Orbitron', sans-serif;
            color: #fff;
            box-shadow: 0 0 40px var(--reveal-color), 0 0 80px var(--reveal-color);
        }
        .reveal-avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        .reveal-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px; font-weight: 900;
            letter-spacing: 0.12em; text-transform: uppercase;
            color: var(--reveal-color);
            text-shadow: 0 0 20px var(--reveal-color);
        }
        .reveal-ranger {
            font-size: 14px; color: rgba(255,255,255,0.5);
            margin-top: 4px;
        }
        .reveal-dino {
            font-size: 11px; color: rgba(255,215,0,0.5);
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 0.08em; text-transform: uppercase;
            margin-top: 6px;
        }
        .reveal-enter {
            margin-top: 24px; padding: 12px 36px;
            background: var(--reveal-color);
            color: #fff; border: none; border-radius: 6px;
            font-family: 'Orbitron', sans-serif;
            font-size: 12px; font-weight: 800;
            letter-spacing: 0.1em; text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 4px 20px var(--reveal-color);
        }
        @keyframes revealPop {
            0% { transform: scale(0.3); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Flash */
        .flash {
            position: fixed; inset: 0;
            background: #fff; opacity: 0;
            pointer-events: none; z-index: 99;
        }
        .flash.ativo { animation: flashAnim 0.5s ease-out forwards; }
        @keyframes flashAnim {
            0% { opacity: 0.9; }
            100% { opacity: 0; }
        }

        /* Click tick sound via Web Audio */
        @media (max-width: 400px) {
            .wheel-wrapper { width: 300px; height: 300px; }
            .wheel-disc { width: 250px; height: 250px; }
            .wheel-icon { width: 44px; height: 44px; font-size: 9px; }
            .center-hub { width: 66px; height: 66px; }
            .center-symbol { font-size: 22px; }
            .info-name { font-size: 17px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>⚡ RODA DE INVOCAÇÃO</h1>
        <a href="index.html">VOLTAR</a>
    </div>

    <div class="wheel-wrapper" id="wheel-wrapper">
        <div class="selector-glow"></div>
        <div class="selector"></div>
        <div class="wheel-disc" id="wheel-disc"></div>
        <div class="center-hub">
            <span class="center-symbol">⚡</span>
        </div>
        <div class="info-panel">
            <div class="info-name" id="info-name">Primal Force</div>
            <div class="info-sub" id="info-sub">20 robôs te esperam</div>
            <div class="info-hint" id="info-hint">Carrega em RODAR ou arrasta a roda</div>
        </div>
        <button class="spin-btn" id="spin-btn">⚡ RODAR</button>
    </div>

    <div class="flash" id="flash"></div>
    <div class="reveal-overlay" id="reveal-overlay">
        <div class="reveal-card">
            <div class="reveal-avatar" id="reveal-avatar"></div>
            <div class="reveal-name" id="reveal-name"></div>
            <div class="reveal-ranger" id="reveal-ranger"></div>
            <div class="reveal-dino" id="reveal-dino"></div>
            <button class="reveal-enter" id="reveal-enter">ENTRAR NO CHAT</button>
        </div>
    </div>

    <script src="primalforce-robots.js"></script>
    <script>
        const disc = document.getElementById('wheel-disc');
        const spinBtn = document.getElementById('spin-btn');
        const infoName = document.getElementById('info-name');
        const infoSub = document.getElementById('info-sub');
        const infoHint = document.getElementById('info-hint');
        const flash = document.getElementById('flash');
        const revealOverlay = document.getElementById('reveal-overlay');

        const allRobots = [...RANGERS_PRINCIPAIS, ...OUTROS_RANGERS];
        const total = allRobots.length;
        const ANGLE_PER_ITEM = 360 / total;
        const DISC_SIZE = 300;
        const ORBIT_RADIUS = DISC_SIZE / 2 - 32;

        let currentAngle = 0;
        let currentVelocity = 0;
        let isSpinning = false;
        let animFrame = null;
        let audioCtx = null;
        let lastTickIndex = -1;

        // Audio context for tick sounds
        function getAudioCtx() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            return audioCtx;
        }

        function playTick() {
            try {
                const ctx = getAudioCtx();
                if (ctx.state === 'suspended') ctx.resume();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(400, ctx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.08);
            } catch {}
        }

        function playSummonSound() {
            try {
                const ctx = getAudioCtx();
                if (ctx.state === 'suspended') ctx.resume();
                const notes = [523, 659, 784, 1047];
                notes.forEach((freq, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.12, ctx.currentTime + i * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.1 + 0.3);
                    osc.start(ctx.currentTime + i * 0.1);
                    osc.stop(ctx.currentTime + i * 0.1 + 0.3);
                });
            } catch {}
        }

        // Create icons on disc
        function criarIcones() {
            disc.innerHTML = '';
            allRobots.forEach((id, i) => {
                const r = PRIMAL_FORCE[id];
                const angle = (ANGLE_PER_ITEM * i) * Math.PI / 180;
                const x = DISC_SIZE / 2 + Math.cos(angle) * ORBIT_RADIUS - 26;
                const y = DISC_SIZE / 2 + Math.sin(angle) * ORBIT_RADIUS - 26;

                const icon = document.createElement('div');
                icon.className = 'wheel-icon';
                icon.style.left = x + 'px';
                icon.style.top = y + 'px';
                icon.style.borderColor = r.cor;
                icon.dataset.index = i;

                if (r.imagem) {
                    const img = document.createElement('img');
                    img.src = r.imagem;
                    img.alt = r.nome;
                    img.onerror = () => { icon.textContent = r.nome[0]; };
                    icon.appendChild(img);
                } else {
                    icon.textContent = r.nome[0];
                }

                icon.addEventListener('click', () => {
                    if (!isSpinning) {
                        selecionarEInvocar(i);
                    }
                });

                disc.appendChild(icon);
            });
        }

        function getSelectedIndex() {
            let normalized = ((-currentAngle % 360) + 360) % 360;
            let index = Math.round(normalized / ANGLE_PER_ITEM) % total;
            return index;
        }

        function updateVisuals() {
            disc.style.transform = `rotate(${currentAngle}deg)`;

            // Counter-rotate icons so they stay upright
            const icons = disc.querySelectorAll('.wheel-icon');
            icons.forEach(icon => {
                icon.style.transform = `rotate(${-currentAngle}deg)`;
            });

            const idx = getSelectedIndex();
            icons.forEach((icon, i) => {
                icon.classList.toggle('active', i === idx);
            });

            const r = PRIMAL_FORCE[allRobots[idx]];
            infoName.textContent = r.nome;
            infoName.style.color = r.cor;
            infoSub.textContent = `Ranger: ${r.ranger} • ${r.dino}`;
        }

        // Spin physics
        function spin() {
            if (isSpinning) return;
            isSpinning = true;
            spinBtn.disabled = true;
            infoHint.classList.add('spinning');

            // Random velocity between 15-25 deg/frame
            currentVelocity = 15 + Math.random() * 10;
            lastTickIndex = -1;

            let frame = 0;
            function animate() {
                currentAngle += currentVelocity;

                // Tick sound
                const idx = getSelectedIndex();
                if (idx !== lastTickIndex) {
                    playTick();
                    lastTickIndex = idx;
                }

                // Friction
                currentVelocity *= 0.985;
                frame++;

                updateVisuals();

                if (currentVelocity > 0.15) {
                    animFrame = requestAnimationFrame(animate);
                } else {
                    currentVelocity = 0;
                    isSpinning = false;
                    spinBtn.disabled = false;
                    infoHint.classList.remove('spinning');
                    onSpinStop();
                }
            }
            animFrame = requestAnimationFrame(animate);
        }

        function onSpinStop() {
            const idx = getSelectedIndex();
            const r = PRIMAL_FORCE[allRobots[idx]];
            playSummonSound();

            // Flash
            flash.style.background = r.cor;
            flash.classList.add('ativo');
            setTimeout(() => flash.classList.remove('ativo'), 500);

            // Reveal
            setTimeout(() => showReveal(idx), 400);
        }

        function showReveal(index) {
            const r = PRIMAL_FORCE[allRobots[index]];
            const avatar = document.getElementById('reveal-avatar');
            avatar.style.setProperty('--reveal-color', r.cor);
            avatar.style.background = r.cor;
            avatar.innerHTML = '';
            if (r.imagem) {
                const img = document.createElement('img');
                img.src = r.imagem;
                img.onerror = () => { avatar.textContent = r.nome[0]; };
                avatar.appendChild(img);
            } else {
                avatar.textContent = r.nome[0];
            }

            document.getElementById('reveal-name').textContent = r.nome;
            document.getElementById('reveal-name').style.color = r.cor;
            document.getElementById('reveal-name').style.setProperty('--reveal-color', r.cor);
            document.getElementById('reveal-ranger').textContent = `Ranger: ${r.ranger}`;
            document.getElementById('reveal-dino').textContent = `${r.supportType.toUpperCase()} • ${r.dino}`;
            document.querySelector('.reveal-enter').style.background = r.cor;
            document.querySelector('.reveal-enter').style.boxShadow = `0 4px 20px ${r.cor}`;

            revealOverlay.classList.add('ativo');

            document.getElementById('reveal-enter').onclick = () => {
                localStorage.setItem('summonedRobot', allRobots[index]);
                window.location.href = `index.html?robot=${allRobots[index]}`;
            };
        }

        function selecionarEInvocar(index) {
            const r = PRIMAL_FORCE[allRobots[index]];
            const targetAngle = -index * ANGLE_PER_ITEM;

            let diff = targetAngle - currentAngle;
            diff = ((diff % 360) + 540) % 360 - 180;

            isSpinning = true;
            spinBtn.disabled = true;
            infoHint.classList.add('spinning');

            const startAngle = currentAngle;
            const endAngle = currentAngle + diff;
            const duration = 600;
            const startTime = performance.now();

            function animateTo(time) {
                const elapsed = time - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const ease = 1 - Math.pow(1 - progress, 3);
                currentAngle = startAngle + diff * ease;

                const idx = getSelectedIndex();
                if (idx !== lastTickIndex) {
                    playTick();
                    lastTickIndex = idx;
                }

                updateVisuals();

                if (progress < 1) {
                    animFrame = requestAnimationFrame(animateTo);
                } else {
                    currentAngle = endAngle;
                    isSpinning = false;
                    spinBtn.disabled = false;
                    infoHint.classList.remove('spinning');
                    updateVisuals();
                    onSpinStop();
                }
            }
            animFrame = requestAnimationFrame(animateTo);
        }

        // Drag to spin
        let dragStartAngle = 0;
        let dragStartX = 0;
        let isDragging = false;
        let dragVelocity = 0;
        let lastDragX = 0;
        let lastDragTime = 0;

        function getAngleFromX(clientX) {
            const rect = disc.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            return Math.atan2(0, clientX - cx) * 180 / Math.PI;
        }

        disc.addEventListener('mousedown', (e) => {
            if (isSpinning) return;
            isDragging = true;
            dragStartX = e.clientX;
            dragStartAngle = currentAngle;
            lastDragX = e.clientX;
            lastDragTime = performance.now();
            disc.style.cursor = 'grabbing';
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const dx = e.clientX - dragStartX;
            currentAngle = dragStartAngle + dx * 0.8;
            updateVisuals();

            const now = performance.now();
            const dt = now - lastDragTime;
            if (dt > 0) {
                dragVelocity = (e.clientX - lastDragX) / dt * 16;
            }
            lastDragX = e.clientX;
            lastDragTime = now;
        });

        document.addEventListener('mouseup', () => {
            if (!isDragging) return;
            isDragging = false;
            disc.style.cursor = '';

            if (Math.abs(dragVelocity) > 2) {
                currentVelocity = dragVelocity * 1.5;
                isSpinning = true;
                spinBtn.disabled = true;
                infoHint.classList.add('spinning');
                lastTickIndex = -1;

                function animateDrag() {
                    currentAngle += currentVelocity;
                    const idx = getSelectedIndex();
                    if (idx !== lastTickIndex) {
                        playTick();
                        lastTickIndex = idx;
                    }
                    currentVelocity *= 0.985;
                    updateVisuals();
                    if (currentVelocity > 0.15) {
                        animFrame = requestAnimationFrame(animateDrag);
                    } else {
                        currentVelocity = 0;
                        isSpinning = false;
                        spinBtn.disabled = false;
                        infoHint.classList.remove('spinning');
                        onSpinStop();
                    }
                }
                animFrame = requestAnimationFrame(animateDrag);
            }
        });

        // Touch
        disc.addEventListener('touchstart', (e) => {
            if (isSpinning) return;
            isDragging = true;
            dragStartX = e.touches[0].clientX;
            dragStartAngle = currentAngle;
            lastDragX = dragStartX;
            lastDragTime = performance.now();
        }, { passive: true });

        document.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const x = e.touches[0].clientX;
            const dx = x - dragStartX;
            currentAngle = dragStartAngle + dx * 0.8;
            updateVisuals();

            const now = performance.now();
            const dt = now - lastDragTime;
            if (dt > 0) dragVelocity = (x - lastDragX) / dt * 16;
            lastDragX = x;
            lastDragTime = now;
        }, { passive: true });

        document.addEventListener('touchend', () => {
            if (!isDragging) return;
            isDragging = false;
            if (Math.abs(dragVelocity) > 2) {
                currentVelocity = dragVelocity * 1.5;
                isSpinning = true;
                spinBtn.disabled = true;
                infoHint.classList.add('spinning');
                lastTickIndex = -1;

                function animateTouch() {
                    currentAngle += currentVelocity;
                    const idx = getSelectedIndex();
                    if (idx !== lastTickIndex) { playTick(); lastTickIndex = idx; }
                    currentVelocity *= 0.985;
                    updateVisuals();
                    if (currentVelocity > 0.15) {
                        animFrame = requestAnimationFrame(animateTouch);
                    } else {
                        currentVelocity = 0;
                        isSpinning = false;
                        spinBtn.disabled = false;
                        infoHint.classList.remove('spinning');
                        onSpinStop();
                    }
                }
                animFrame = requestAnimationFrame(animateTouch);
            }
        });

        spinBtn.addEventListener('click', spin);

        // Init
        criarIcones();
        updateVisuals();
    </script>
</body>
</html>
