<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a1a">
    <title>Primal Force — Roda de Invocação</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --power-dark: #0a0a1a; --power-gold: #FFD700; }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: 'Rajdhani', sans-serif;
            background: #000; color: #e8e8f0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            user-select: none; -webkit-user-select: none;
        }

        .header {
            position: fixed; top: 0; left: 0; right: 0;
            padding: 14px 20px; display: flex; align-items: center; gap: 12px;
            background: rgba(0,0,0,0.95);
            border-bottom: 1px solid rgba(255,215,0,0.08); z-index: 50;
        }
        .header h1 {
            font-family: 'Orbitron', sans-serif; font-size: 13px;
            font-weight: 700; letter-spacing: 0.1em; color: var(--power-gold);
        }
        .header a {
            margin-left: auto; font-family: 'Orbitron', sans-serif;
            font-size: 10px; font-weight: 700; color: var(--power-gold);
            text-decoration: none; padding: 7px 14px;
            border: 1px solid rgba(255,215,0,0.2); border-radius: 4px;
            transition: all 0.2s;
        }
        .header a:hover { background: rgba(255,215,0,0.1); }

        .scene {
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            perspective: 800px;
        }

        .wheel {
            position: relative;
            width: 120px; height: 120px;
            transform-style: preserve-3d;
        }

        .wheel-item {
            position: absolute;
            width: 65px; height: 65px;
            left: 27px; top: 27px;
            will-change: transform, opacity;
            transform-style: preserve-3d;
        }

        .wheel-item-inner {
            width: 100%; height: 100%;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: rgba(10,10,25,0.95);
            border: 3px solid transparent;
            font-size: 14px; font-weight: 800;
            font-family: 'Orbitron', sans-serif; color: #fff;
            cursor: pointer;
            transition: border-color 0.3s, box-shadow 0.3s;
            overflow: hidden;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .wheel-item-inner img {
            width: 100%; height: 100%;
            border-radius: 50%; object-fit: cover;
        }

        .wheel-item.selected .wheel-item-inner {
            border-color: var(--item-color);
            box-shadow: 0 0 20px var(--item-color),
                        0 0 40px color-mix(in srgb, var(--item-color) 30%, transparent);
        }

        .pulse-ring {
            position: absolute; inset: -4px; border-radius: 50%;
            border: 2px solid var(--item-color);
            animation: pulseRing 1.5s ease-out infinite;
            pointer-events: none;
        }
        @keyframes pulseRing {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.4); opacity: 0; }
        }

        .info-panel {
            position: fixed; bottom: 100px;
            text-align: center; width: 100%;
        }
        .info-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 26px; font-weight: 900;
            letter-spacing: 0.12em; text-transform: uppercase;
            transition: color 0.3s;
        }
        .info-sub {
            font-size: 13px; color: rgba(255,255,255,0.4); margin-top: 4px;
        }
        .info-type {
            font-size: 10px; font-family: 'Orbitron', sans-serif;
            letter-spacing: 0.1em; text-transform: uppercase;
            margin-top: 6px; opacity: 0.5;
        }
        .hint {
            font-size: 11px; color: rgba(255,255,255,0.15);
            margin-top: 14px;
        }

        .arrow {
            position: fixed; top: 50%; transform: translateY(-50%);
            width: 50px; height: 50px;
            border-radius: 50%;
            background: rgba(255,215,0,0.06);
            border: 1px solid rgba(255,215,0,0.15);
            color: var(--power-gold); font-size: 22px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 20; transition: all 0.2s;
        }
        .arrow:hover { background: rgba(255,215,0,0.12); }
        .arrow.left { left: 20px; }
        .arrow.right { right: 20px; }

        .counter {
            position: fixed; top: 60px; right: 20px;
            font-family: 'Orbitron', sans-serif;
            font-size: 10px; color: rgba(255,255,255,0.2); z-index: 50;
        }

        .flash {
            position: fixed; inset: 0;
            pointer-events: none; z-index: 99; opacity: 0;
        }
        .flash.on { animation: flashFx 0.5s ease-out forwards; }
        @keyframes flashFx { 0% { opacity: 0.9; } 100% { opacity: 0; } }

        .reveal {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0);
            display: none; align-items: center; justify-content: center;
            z-index: 100; transition: background 0.4s;
        }
        .reveal.on { display: flex; background: rgba(0,0,0,0.92); }
        .reveal-card { text-align: center; animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .reveal-ring {
            width: 130px; height: 130px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 16px;
            border: 4px solid var(--rev-color);
            box-shadow: 0 0 40px var(--rev-color), 0 0 80px color-mix(in srgb, var(--rev-color) 50%, transparent);
        }
        .reveal-avatar {
            width: 110px; height: 110px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 44px; font-weight: 900;
            font-family: 'Orbitron', sans-serif; color: #fff;
            background: rgba(10,10,25,0.95);
        }
        .reveal-avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        .reveal-name {
            font-family: 'Orbitron', sans-serif; font-size: 28px;
            font-weight: 900; letter-spacing: 0.12em; text-transform: uppercase;
            color: var(--rev-color);
        }
        .reveal-ranger { font-size: 14px; color: rgba(255,255,255,0.4); margin-top: 4px; }
        .reveal-dino {
            font-size: 10px; font-family: 'Orbitron', sans-serif;
            letter-spacing: 0.1em; text-transform: uppercase; margin-top: 6px;
            color: var(--rev-color); opacity: 0.6;
        }
        .reveal-btn {
            margin-top: 28px; padding: 14px 40px;
            background: var(--rev-color); color: #fff; border: none;
            border-radius: 6px; font-family: 'Orbitron', sans-serif;
            font-size: 12px; font-weight: 800;
            letter-spacing: 0.1em; text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 4px 20px var(--rev-color);
        }
        .reveal-close {
            position: absolute; top: 20px; right: 20px;
            width: 36px; height: 36px; border-radius: 50%;
            background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15);
            color: #fff; font-size: 18px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.2s;
        }
        .reveal-close:hover { background: rgba(255,255,255,0.12); }

        @keyframes popIn {
            0% { transform: scale(0.3); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>⚡ RODA DE INVOCAÇÃO</h1>
        <a href="index.html">VOLTAR</a>
    </div>
    <div class="counter" id="counter">1 / 20</div>

    <div class="scene" id="scene">
        <div class="wheel" id="wheel"></div>
    </div>

    <div class="arrow left" id="arrow-left">‹</div>
    <div class="arrow right" id="arrow-right">›</div>

    <div class="info-panel">
        <div class="info-name" id="info-name">Primal Force</div>
        <div class="info-sub" id="info-sub">Arrasta ou usa as setas</div>
        <div class="info-type" id="info-type"></div>
        <div class="hint">Toca no robô da frente para invocar</div>
    </div>

    <div class="flash" id="flash"></div>
    <div class="reveal" id="reveal">
        <button class="reveal-close" id="rev-close">✕</button>
        <div class="reveal-card">
            <div class="reveal-ring">
                <div class="reveal-avatar" id="rev-avatar"></div>
            </div>
            <div class="reveal-name" id="rev-name"></div>
            <div class="reveal-ranger" id="rev-ranger"></div>
            <div class="reveal-dino" id="rev-dino"></div>
            <button class="reveal-btn" id="rev-btn">ENTRAR NO CHAT</button>
        </div>
    </div>

    <script src="primalforce-robots.js"></script>
    <script>
    (function() {
        const wheelEl = document.getElementById('wheel');
        const flashEl = document.getElementById('flash');
        const revealEl = document.getElementById('reveal');
        const infoName = document.getElementById('info-name');
        const infoSub = document.getElementById('info-sub');
        const infoType = document.getElementById('info-type');
        const counterEl = document.getElementById('counter');

        const allRobots = [...RANGERS_PRINCIPAIS, ...OUTROS_RANGERS];
        const total = allRobots.length;
        const ANGLE_PER_ITEM = 360 / total;
        const RING_RADIUS = 600;

        let rotationAngle = 0;
        let targetAngle = 0;
        let selectedIndex = 0;
        let animating = false;
        let animFrame = null;

        function getSelectedIndex(angle) {
            return (((-angle / ANGLE_PER_ITEM) % total) + total) % total;
        }

        function build() {
            wheelEl.innerHTML = '';
            allRobots.forEach(function(id, i) {
                const r = PRIMAL_FORCE[id];
                var item = document.createElement('div');
                item.className = 'wheel-item';
                item.dataset.index = i;

                var inner = document.createElement('div');
                inner.className = 'wheel-item-inner';
                inner.style.setProperty('--item-color', r.cor);

                if (r.imagem) {
                    var img = document.createElement('img');
                    img.src = r.imagem;
                    img.alt = r.nome;
                    img.onerror = function() { img.remove(); inner.textContent = r.nome[0]; };
                    inner.appendChild(img);
                } else {
                    inner.textContent = r.nome[0];
                }

                var pulse = document.createElement('div');
                pulse.className = 'pulse-ring';
                pulse.style.display = 'none';
                item.appendChild(pulse);

                (function(idx) {
                    inner.addEventListener('click', function() {
                        var si = getSelectedIndex(rotationAngle);
                        if (idx === Math.round(si) && !animating) {
                            invocar(idx);
                        } else {
                            goTo(idx);
                        }
                    });
                })(i);

                item.appendChild(inner);
                wheelEl.appendChild(item);
            });
            render();
        }

        function render() {
            var items = wheelEl.querySelectorAll('.wheel-item');
            var si = getSelectedIndex(rotationAngle);
            selectedIndex = Math.round(si);

            var itemData = [];
            items.forEach(function(item, i) {
                var angleDeg = ANGLE_PER_ITEM * i + rotationAngle;
                var angleRad = angleDeg * Math.PI / 180;

                var x = Math.sin(angleRad) * RING_RADIUS;
                var z = Math.cos(angleRad) * RING_RADIUS;

                var angleFromFront = Math.abs(((angleDeg % 360) + 540) % 360 - 180);
                var depthFactor = angleFromFront / 180;

                var scale = 1.5 - depthFactor * 0.5;
                var brightness = 1 - depthFactor * 0.8;
                var yOffset = -(1 - depthFactor) * 80;
                var rotateY = depthFactor * 85;

                itemData.push({
                    item: item, i: i, x: x, z: z, scale: scale,
                    brightness: brightness, yOffset: yOffset,
                    rotateY: rotateY, depthFactor: depthFactor
                });
            });

            itemData.sort(function(a, b) { return a.z - b.z; });

            itemData.forEach(function(d, rank) {
                d.item.style.transform = 'translateX(' + d.x + 'px) translateY(' + d.yOffset + 'px) scale(' + d.scale + ') rotateY(' + d.rotateY + 'deg)';
                d.item.style.opacity = 1;
                d.item.style.filter = 'brightness(' + d.brightness + ')';
                d.item.style.zIndex = rank;

                var isSelected = d.i === selectedIndex;
                d.item.classList.toggle('selected', isSelected);

                var pulseEl = d.item.querySelector('.pulse-ring');
                pulseEl.style.display = isSelected ? 'block' : 'none';
            });

            var r = PRIMAL_FORCE[allRobots[selectedIndex]];
            infoName.textContent = r.nome;
            infoName.style.color = r.cor;
            infoSub.textContent = 'Ranger: ' + r.ranger + ' \u2022 ' + r.dino;
            infoType.textContent = r.supportType.toUpperCase();
            counterEl.textContent = (selectedIndex + 1) + ' / ' + total;
        }

        function goTo(index, duration) {
            if (animating) return;
            duration = duration || 500;

            targetAngle = -index * ANGLE_PER_ITEM;

            var diff = targetAngle - rotationAngle;
            diff = ((diff % 360) + 540) % 360 - 180;

            var startAngle = rotationAngle;
            var endAngle = rotationAngle + diff;
            var t0 = performance.now();

            animating = true;

            function anim(t) {
                var p = Math.min((t - t0) / duration, 1);
                var ease = 1 - Math.pow(1 - p, 3);
                rotationAngle = startAngle + diff * ease;
                render();
                if (p < 1) {
                    animFrame = requestAnimationFrame(anim);
                } else {
                    rotationAngle = endAngle;
                    animating = false;
                    render();
                }
            }

            if (animFrame) cancelAnimationFrame(animFrame);
            animFrame = requestAnimationFrame(anim);
        }

        document.getElementById('arrow-left').addEventListener('click', function() {
            goTo((selectedIndex - 1 + total) % total);
        });
        document.getElementById('arrow-right').addEventListener('click', function() {
            goTo((selectedIndex + 1) % total);
        });

        document.addEventListener('keydown', function(e) {
            if (revealEl.classList.contains('on')) {
                if (e.key === 'Escape') closeReveal();
                return;
            }
            if (e.key === 'ArrowLeft') goTo((selectedIndex - 1 + total) % total);
            else if (e.key === 'ArrowRight') goTo((selectedIndex + 1) % total);
            else if (e.key === 'Enter' && !animating) invocar(selectedIndex);
        });

        var dragging = false;
        var dragStartX = 0;
        var dragStartAngle = 0;
        var lastX = 0;
        var lastT = 0;
        var dragVel = 0;

        function onDragStart(x) {
            if (animating && animFrame) {
                cancelAnimationFrame(animFrame);
                animating = false;
            }
            dragging = true;
            dragStartX = x;
            dragStartAngle = rotationAngle;
            lastX = x;
            lastT = performance.now();
            dragVel = 0;
        }

        function onDragMove(x) {
            if (!dragging) return;
            var dx = x - dragStartX;
            rotationAngle = dragStartAngle + dx * 0.5;
            var now = performance.now();
            var dt = now - lastT;
            if (dt > 0) dragVel = (x - lastX) / dt;
            lastX = x;
            lastT = now;
            render();
        }

        function onDragEnd() {
            if (!dragging) return;
            dragging = false;
            var idx;
            if (Math.abs(dragVel) > 0.3) {
                var projected = rotationAngle - dragVel * 300;
                idx = Math.round(-projected / ANGLE_PER_ITEM);
            } else {
                idx = Math.round(-rotationAngle / ANGLE_PER_ITEM);
            }
            idx = ((idx % total) + total) % total;
            goTo(idx);
            dragVel = 0;
        }

        wheelEl.addEventListener('mousedown', function(e) {
            e.preventDefault();
            onDragStart(e.clientX);
        });
        document.addEventListener('mousemove', function(e) { onDragMove(e.clientX); });
        document.addEventListener('mouseup', onDragEnd);

        wheelEl.addEventListener('touchstart', function(e) {
            onDragStart(e.touches[0].clientX);
        }, { passive: true });
        document.addEventListener('touchmove', function(e) {
            if (!dragging) return;
            e.preventDefault();
            onDragMove(e.touches[0].clientX);
        }, { passive: false });
        document.addEventListener('touchend', onDragEnd);

        var invocando = false;
        function invocar(idx) {
            if (invocando) return;
            invocando = true;
            var r = PRIMAL_FORCE[allRobots[idx]];

            flashEl.style.background = r.cor;
            flashEl.classList.add('on');
            setTimeout(function() { flashEl.classList.remove('on'); }, 500);

            setTimeout(function() {
                var av = document.getElementById('rev-avatar');
                av.style.background = r.cor;
                av.innerHTML = r.imagem
                    ? '<img src="' + r.imagem + '" alt="" onerror="this.parentElement.innerHTML=\'' + r.nome[0] + '\'">'
                    : r.nome[0];
                document.getElementById('rev-name').textContent = r.nome;
                document.getElementById('rev-name').style.color = r.cor;
                document.getElementById('rev-ranger').textContent = 'Ranger: ' + r.ranger;
                document.getElementById('rev-dino').textContent = r.supportType.toUpperCase() + ' \u2022 ' + r.dino;
                document.getElementById('rev-btn').style.background = r.cor;
                document.getElementById('rev-btn').style.boxShadow = '0 4px 20px ' + r.cor;
                document.querySelector('.reveal-ring').style.setProperty('--rev-color', r.cor);
                revealEl.classList.add('on');
                document.getElementById('rev-btn').onclick = function() {
                    localStorage.setItem('summonedRobot', allRobots[idx]);
                    window.location.href = 'index.html?robot=' + allRobots[idx];
                };
            }, 350);
        }

        function closeReveal() {
            revealEl.classList.remove('on');
            invocando = false;
        }
        document.getElementById('rev-close').addEventListener('click', closeReveal);
        revealEl.addEventListener('click', function(e) {
            if (e.target === revealEl) closeReveal();
        });

        build();
    })();
    </script>
</body>
</html>
