<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a1a">
    <title>Primal Force — Roda de Invocação</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --power-dark: #0a0a1a; --power-gold: #FFD700; }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: 'Rajdhani', sans-serif;
            background: #000; color: #e8e8f0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            user-select: none; -webkit-user-select: none;
        }

        .header {
            position: fixed; top: 0; left: 0; right: 0;
            padding: 14px 20px; display: flex; align-items: center; gap: 12px;
            background: rgba(0,0,0,0.95);
            border-bottom: 1px solid rgba(255,215,0,0.08); z-index: 50;
        }
        .header h1 {
            font-family: 'Orbitron', sans-serif; font-size: 13px;
            font-weight: 700; letter-spacing: 0.1em; color: var(--power-gold);
        }
        .header a {
            margin-left: auto; font-family: 'Orbitron', sans-serif;
            font-size: 10px; font-weight: 700; color: var(--power-gold);
            text-decoration: none; padding: 7px 14px;
            border: 1px solid rgba(255,215,0,0.2); border-radius: 4px;
            transition: all 0.2s;
        }
        .header a:hover { background: rgba(255,215,0,0.1); }

        .scene {
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
        }

        .wheel {
            position: relative;
            width: 120px; height: 120px;
        }

        .wheel-item {
            position: absolute;
            width: 90px; height: 90px;
            left: 15px; top: 15px;
            will-change: transform, opacity;
        }

        .wheel-item-inner {
            width: 100%; height: 100%;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: rgba(10,10,25,0.95);
            border: 3px solid transparent;
            font-size: 14px; font-weight: 800;
            font-family: 'Orbitron', sans-serif; color: #fff;
            cursor: pointer;
            transition: border-color 0.3s, box-shadow 0.3s;
            overflow: hidden;
        }
        .wheel-item-inner img {
            width: 100%; height: 100%;
            border-radius: 50%; object-fit: cover;
        }

        .wheel-item.selected .wheel-item-inner {
            border-color: var(--item-color);
            box-shadow: 0 0 20px var(--item-color),
                        0 0 40px color-mix(in srgb, var(--item-color) 30%, transparent);
        }

        .pulse-ring {
            position: absolute; inset: -4px; border-radius: 50%;
            border: 2px solid var(--item-color);
            animation: pulseRing 1.5s ease-out infinite;
            pointer-events: none;
        }
        @keyframes pulseRing {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.4); opacity: 0; }
        }

        .info-panel {
            position: fixed; bottom: 100px;
            text-align: center; width: 100%;
        }
        .info-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 26px; font-weight: 900;
            letter-spacing: 0.12em; text-transform: uppercase;
            transition: color 0.3s;
        }
        .info-sub {
            font-size: 13px; color: rgba(255,255,255,0.4); margin-top: 4px;
        }
        .info-type {
            font-size: 10px; font-family: 'Orbitron', sans-serif;
            letter-spacing: 0.1em; text-transform: uppercase;
            margin-top: 6px; opacity: 0.5;
        }
        .hint {
            font-size: 11px; color: rgba(255,255,255,0.15);
            margin-top: 14px;
        }

        .arrow {
            position: fixed; top: 50%; transform: translateY(-50%);
            width: 50px; height: 50px;
            border-radius: 50%;
            background: rgba(255,215,0,0.06);
            border: 1px solid rgba(255,215,0,0.15);
            color: var(--power-gold); font-size: 22px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 20; transition: all 0.2s;
        }
        .arrow:hover { background: rgba(255,215,0,0.12); }
        .arrow.left { left: 20px; }
        .arrow.right { right: 20px; }

        .counter {
            position: fixed; top: 60px; right: 20px;
            font-family: 'Orbitron', sans-serif;
            font-size: 10px; color: rgba(255,255,255,0.2); z-index: 50;
        }

        .flash {
            position: fixed; inset: 0;
            pointer-events: none; z-index: 99; opacity: 0;
        }
        .flash.on { animation: flashFx 0.5s ease-out forwards; }
        @keyframes flashFx { 0% { opacity: 0.9; } 100% { opacity: 0; } }

        .reveal {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0);
            display: none; align-items: center; justify-content: center;
            z-index: 100; transition: background 0.4s;
        }
        .reveal.on { display: flex; background: rgba(0,0,0,0.92); }
        .reveal-card { text-align: center; animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .reveal-ring {
            width: 130px; height: 130px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 16px;
            border: 4px solid var(--rev-color);
            box-shadow: 0 0 40px var(--rev-color), 0 0 80px color-mix(in srgb, var(--rev-color) 50%, transparent);
        }
        .reveal-avatar {
            width: 110px; height: 110px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 44px; font-weight: 900;
            font-family: 'Orbitron', sans-serif; color: #fff;
            background: rgba(10,10,25,0.95);
        }
        .reveal-avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        .reveal-name {
            font-family: 'Orbitron', sans-serif; font-size: 28px;
            font-weight: 900; letter-spacing: 0.12em; text-transform: uppercase;
            color: var(--rev-color);
        }
        .reveal-ranger { font-size: 14px; color: rgba(255,255,255,0.4); margin-top: 4px; }
        .reveal-dino {
            font-size: 10px; font-family: 'Orbitron', sans-serif;
            letter-spacing: 0.1em; text-transform: uppercase; margin-top: 6px;
            color: var(--rev-color); opacity: 0.6;
        }
        .reveal-btn {
            margin-top: 28px; padding: 14px 40px;
            background: var(--rev-color); color: #fff; border: none;
            border-radius: 6px; font-family: 'Orbitron', sans-serif;
            font-size: 12px; font-weight: 800;
            letter-spacing: 0.1em; text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 4px 20px var(--rev-color);
        }
        .reveal-close {
            position: absolute; top: 20px; right: 20px;
            width: 36px; height: 36px; border-radius: 50%;
            background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15);
            color: #fff; font-size: 18px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.2s;
        }
        .reveal-close:hover { background: rgba(255,255,255,0.12); }

        @keyframes popIn {
            0% { transform: scale(0.3); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>⚡ RODA DE INVOCAÇÃO</h1>
        <a href="index.html">VOLTAR</a>
    </div>
    <div class="counter" id="counter">1 / 20</div>

    <div class="scene" id="scene">
        <div class="wheel" id="wheel"></div>
    </div>

    <div class="arrow left" id="arrow-left">‹</div>
    <div class="arrow right" id="arrow-right">›</div>

    <div class="info-panel">
        <div class="info-name" id="info-name">Primal Force</div>
        <div class="info-sub" id="info-sub">Arrasta ou usa as setas</div>
        <div class="info-type" id="info-type"></div>
        <div class="hint">Toca no robô da frente para invocar</div>
    </div>

    <div class="flash" id="flash"></div>
    <div class="reveal" id="reveal">
        <button class="reveal-close" id="rev-close">✕</button>
        <div class="reveal-card">
            <div class="reveal-ring">
                <div class="reveal-avatar" id="rev-avatar"></div>
            </div>
            <div class="reveal-name" id="rev-name"></div>
            <div class="reveal-ranger" id="rev-ranger"></div>
            <div class="reveal-dino" id="rev-dino"></div>
            <button class="reveal-btn" id="rev-btn">ENTRAR NO CHAT</button>
        </div>
    </div>

    <script src="primalforce-robots.js"></script>
    <script>
        const wheelEl = document.getElementById('wheel');
        const flashEl = document.getElementById('flash');
        const revealEl = document.getElementById('reveal');
        const infoName = document.getElementById('info-name');
        const infoSub = document.getElementById('info-sub');
        const infoType = document.getElementById('info-type');
        const counterEl = document.getElementById('counter');

        const allRobots = [...RANGERS_PRINCIPAIS, ...OUTROS_RANGERS];
        const total = allRobots.length;
        const ANGLE_STEP = 360 / total;
        const RING_RADIUS = 320;

        let selectedIndex = 0;
        let animating = false;
        let animFrame = null;

        function build() {
            wheelEl.innerHTML = '';
            allRobots.forEach((id, i) => {
                const r = PRIMAL_FORCE[id];

                const item = document.createElement('div');
                item.className = 'wheel-item';
                item.dataset.index = i;

                const inner = document.createElement('div');
                inner.className = 'wheel-item-inner';
                inner.style.setProperty('--item-color', r.cor);

                if (r.imagem) {
                    const img = document.createElement('img');
                    img.src = r.imagem;
                    img.alt = r.nome;
                    img.onerror = () => { img.remove(); inner.textContent = r.nome[0]; };
                    inner.appendChild(img);
                } else {
                    inner.textContent = r.nome[0];
                }

                const pulse = document.createElement('div');
                pulse.className = 'pulse-ring';
                pulse.style.display = 'none';
                item.appendChild(pulse);

                inner.addEventListener('click', () => {
                    if (i === selectedIndex && !animating) {
                        invocar(i);
                    } else {
                        goTo(i);
                    }
                });

                item.appendChild(inner);
                wheelEl.appendChild(item);
            });
            render();
        }

        function render() {
            const items = wheelEl.querySelectorAll('.wheel-item');

            items.forEach((item, i) => {
                const angleDeg = ANGLE_STEP * (i - selectedIndex);
                const angleRad = angleDeg * Math.PI / 180;

                const x = Math.sin(angleRad) * RING_RADIUS;
                const z = Math.cos(angleRad);

                const absAngle = Math.abs(angleDeg % 360);
                const normalAngle = absAngle > 180 ? 360 - absAngle : absAngle;
                const depthFactor = normalAngle / 180;

                const scale = 1 - depthFactor * 0.6;
                const opacity = 1 - depthFactor * 0.75;
                const yOffset = z * 20;

                item.style.transform = `translateX(${x}px) translateY(${yOffset}px) scale(${scale})`;
                item.style.opacity = opacity;
                item.style.zIndex = Math.round((1 - depthFactor) * 100);

                const isSelected = i === selectedIndex;
                item.classList.toggle('selected', isSelected);

                const pulseEl = item.querySelector('.pulse-ring');
                pulseEl.style.display = isSelected ? 'block' : 'none';
            });

            const r = PRIMAL_FORCE[allRobots[selectedIndex]];
            infoName.textContent = r.nome;
            infoName.style.color = r.cor;
            infoSub.textContent = `Ranger: ${r.ranger} • ${r.dino}`;
            infoType.textContent = r.supportType.toUpperCase();
            counterEl.textContent = `${selectedIndex + 1} / ${total}`;
        }

        function goTo(index, duration) {
            if (animating) return;
            if (index === selectedIndex) { render(); return; }

            animating = true;
            duration = duration || 500;

            const from = selectedIndex;
            const to = index;
            const t0 = performance.now();

            function anim(t) {
                const p = Math.min((t - t0) / duration, 1);
                const ease = 1 - Math.pow(1 - p, 3);

                selectedIndex = p < 1 ? from + (to - from) * ease : to;
                if (p < 1) {
                    selectedIndex = Math.round(selectedIndex * 100) / 100;
                    render();
                    animFrame = requestAnimationFrame(anim);
                } else {
                    selectedIndex = to;
                    animating = false;
                    render();
                }
            }

            if (animFrame) cancelAnimationFrame(animFrame);
            animFrame = requestAnimationFrame(anim);
        }

        function snapToIndex() {
            const idx = Math.round(selectedIndex);
            goTo(((idx % total) + total) % total);
        }

        document.getElementById('arrow-left').addEventListener('click', () => {
            goTo((selectedIndex - 1 + total) % total);
        });
        document.getElementById('arrow-right').addEventListener('click', () => {
            goTo((selectedIndex + 1) % total);
        });

        document.addEventListener('keydown', e => {
            if (revealEl.classList.contains('on')) {
                if (e.key === 'Escape') closeReveal();
                return;
            }
            if (e.key === 'ArrowLeft') goTo((selectedIndex - 1 + total) % total);
            else if (e.key === 'ArrowRight') goTo((selectedIndex + 1) % total);
            else if (e.key === 'Enter' && !animating) invocar(selectedIndex);
        });

        let dragging = false;
        let dragStartX = 0;
        let dragStartIdx = 0;
        let lastX = 0;
        let lastT = 0;
        let dragVel = 0;

        function onDragStart(x) {
            if (animating) return;
            dragging = true;
            dragStartX = x;
            dragStartIdx = selectedIndex;
            lastX = x;
            lastT = performance.now();
            dragVel = 0;
            if (animFrame) cancelAnimationFrame(animFrame);
        }

        function onDragMove(x) {
            if (!dragging) return;
            const dx = x - dragStartX;
            const idxDelta = dx / 80;
            selectedIndex = dragStartIdx - idxDelta;
            const now = performance.now();
            const dt = now - lastT;
            if (dt > 0) dragVel = (x - lastX) / dt;
            lastX = x;
            lastT = now;
            render();
        }

        function onDragEnd() {
            if (!dragging) return;
            dragging = false;
            let idx;
            if (Math.abs(dragVel) > 0.3) {
                idx = Math.round(selectedIndex - dragVel * 3);
            } else {
                idx = Math.round(selectedIndex);
            }
            idx = ((idx % total) + total) % total;
            goTo(idx);
            dragVel = 0;
        }

        wheelEl.addEventListener('mousedown', e => { e.preventDefault(); onDragStart(e.clientX); });
        document.addEventListener('mousemove', e => onDragMove(e.clientX));
        document.addEventListener('mouseup', onDragEnd);

        wheelEl.addEventListener('touchstart', e => { onDragStart(e.touches[0].clientX); }, { passive: true });
        document.addEventListener('touchmove', e => {
            if (!dragging) return;
            e.preventDefault();
            onDragMove(e.touches[0].clientX);
        }, { passive: false });
        document.addEventListener('touchend', onDragEnd);

        let invocando = false;
        function invocar(idx) {
            if (invocando) return;
            invocando = true;
            const r = PRIMAL_FORCE[allRobots[idx]];

            flashEl.style.background = r.cor;
            flashEl.classList.add('on');
            setTimeout(() => flashEl.classList.remove('on'), 500);

            setTimeout(() => {
                const av = document.getElementById('rev-avatar');
                av.style.background = r.cor;
                av.innerHTML = r.imagem
                    ? `<img src="${r.imagem}" alt="" onerror="this.parentElement.innerHTML='${r.nome[0]}'">`
                    : r.nome[0];
                document.getElementById('rev-name').textContent = r.nome;
                document.getElementById('rev-name').style.color = r.cor;
                document.getElementById('rev-ranger').textContent = `Ranger: ${r.ranger}`;
                document.getElementById('rev-dino').textContent = `${r.supportType.toUpperCase()} • ${r.dino}`;
                document.getElementById('rev-btn').style.background = r.cor;
                document.getElementById('rev-btn').style.boxShadow = `0 4px 20px ${r.cor}`;
                document.querySelector('.reveal-ring').style.setProperty('--rev-color', r.cor);
                revealEl.classList.add('on');
                document.getElementById('rev-btn').onclick = () => {
                    localStorage.setItem('summonedRobot', allRobots[idx]);
                    window.location.href = `index.html?robot=${allRobots[idx]}`;
                };
            }, 350);
        }

        function closeReveal() {
            revealEl.classList.remove('on');
            invocando = false;
        }
        document.getElementById('rev-close').addEventListener('click', closeReveal);
        revealEl.addEventListener('click', e => {
            if (e.target === revealEl) closeReveal();
        });

        build();
    </script>
</body>
</html>
