<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a1a">
    <title>Primal Force — Roda de Invocação</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --power-dark: #0a0a1a; --power-gold: #FFD700; }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: 'Rajdhani', sans-serif;
            background: #000; color: #e8e8f0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            user-select: none; -webkit-user-select: none;
        }

        .header {
            position: fixed; top: 0; left: 0; right: 0;
            padding: 14px 20px; display: flex; align-items: center; gap: 12px;
            background: rgba(0,0,0,0.9);
            border-bottom: 1px solid rgba(255,215,0,0.08); z-index: 50;
        }
        .header h1 {
            font-family: 'Orbitron', sans-serif; font-size: 13px;
            font-weight: 700; letter-spacing: 0.1em; color: var(--power-gold);
        }
        .header a {
            margin-left: auto; font-family: 'Orbitron', sans-serif;
            font-size: 10px; font-weight: 700; color: var(--power-gold);
            text-decoration: none; padding: 7px 14px;
            border: 1px solid rgba(255,215,0,0.2); border-radius: 4px;
            transition: all 0.2s;
        }
        .header a:hover { background: rgba(255,215,0,0.1); }

        /* Main carousel area */
        .carousel-wrapper {
            position: relative;
            width: 100%; max-width: 600px;
            height: 320px;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
        }

        /* Background glow */
        .bg-glow {
            position: absolute;
            width: 300px; height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--glow-color, rgba(255,100,100,0.15)) 0%, transparent 70%);
            transition: background 0.5s;
            pointer-events: none;
        }

        /* The horizontal track */
        .carousel-track {
            position: relative;
            width: 100%; height: 200px;
            display: flex; align-items: center; justify-content: center;
            overflow: visible;
            cursor: grab;
        }
        .carousel-track:active { cursor: grabbing; }

        /* Individual item */
        .carousel-item {
            position: absolute;
            width: 120px; height: 120px;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.45s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            cursor: pointer;
        }

        .item-ring {
            width: 100%; height: 100%;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            border: 3px solid transparent;
            transition: all 0.45s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
        }

        /* Outer glow ring for selected */
        .item-ring::before {
            content: '';
            position: absolute; inset: -8px;
            border-radius: 50%;
            border: 2px solid transparent;
            transition: border-color 0.4s;
            opacity: 0;
        }

        .item-icon {
            width: 80px; height: 80px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: rgba(15,15,30,0.9);
            font-size: 14px; font-weight: 800;
            font-family: 'Orbitron', sans-serif; color: #fff;
            transition: all 0.4s;
            overflow: hidden;
        }
        .item-icon img {
            width: 100%; height: 100%;
            border-radius: 50%; object-fit: cover;
        }

        /* Selected state */
        .carousel-item.selected {
            z-index: 10;
        }
        .carousel-item.selected .item-ring {
            border-color: var(--item-color, var(--power-gold));
            box-shadow: 0 0 25px var(--item-color, var(--power-gold)),
                        0 0 50px color-mix(in srgb, var(--item-color, var(--power-gold)) 40%, transparent);
        }
        .carousel-item.selected .item-ring::before {
            border-color: var(--item-color, var(--power-gold));
            opacity: 0.3;
        }

        /* Info panel */
        .info-panel {
            text-align: center; margin-top: 30px;
        }
        .info-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px; font-weight: 900;
            letter-spacing: 0.12em; text-transform: uppercase;
            transition: color 0.3s;
        }
        .info-sub {
            font-size: 13px; color: rgba(255,255,255,0.4); margin-top: 4px;
        }
        .info-type {
            font-size: 10px; font-family: 'Orbitron', sans-serif;
            letter-spacing: 0.1em; text-transform: uppercase;
            margin-top: 6px; opacity: 0.5;
        }

        /* Hint */
        .hint {
            position: fixed; bottom: 40px;
            font-size: 11px; color: rgba(255,255,255,0.2);
            animation: hintPulse 2.5s ease-in-out infinite;
        }
        @keyframes hintPulse {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 0.5; }
        }

        /* Swipe indicators */
        .swipe-arrow {
            position: fixed; top: 50%; transform: translateY(-50%);
            font-size: 28px; color: rgba(255,255,255,0.15);
            pointer-events: none; transition: opacity 0.3s;
        }
        .swipe-arrow.left { left: 16px; }
        .swipe-arrow.right { right: 16px; }

        /* Counter */
        .counter {
            position: fixed; top: 60px; right: 20px;
            font-family: 'Orbitron', sans-serif;
            font-size: 10px; color: rgba(255,255,255,0.25); z-index: 50;
        }

        /* Reveal overlay */
        .reveal {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0);
            display: none; align-items: center; justify-content: center;
            z-index: 100; transition: background 0.4s;
        }
        .reveal.on { display: flex; background: rgba(0,0,0,0.9); }
        .reveal-card { text-align: center; animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .reveal-ring {
            width: 130px; height: 130px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 16px;
            border: 4px solid var(--rev-color);
            box-shadow: 0 0 40px var(--rev-color), 0 0 80px color-mix(in srgb, var(--rev-color) 50%, transparent);
        }
        .reveal-avatar {
            width: 110px; height: 110px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 44px; font-weight: 900;
            font-family: 'Orbitron', sans-serif; color: #fff;
            background: rgba(15,15,30,0.9);
        }
        .reveal-avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        .reveal-name {
            font-family: 'Orbitron', sans-serif; font-size: 28px;
            font-weight: 900; letter-spacing: 0.12em; text-transform: uppercase;
            color: var(--rev-color);
        }
        .reveal-ranger { font-size: 14px; color: rgba(255,255,255,0.4); margin-top: 4px; }
        .reveal-dino {
            font-size: 10px; font-family: 'Orbitron', sans-serif;
            letter-spacing: 0.1em; text-transform: uppercase; margin-top: 6px;
            color: var(--rev-color); opacity: 0.6;
        }
        .reveal-btn {
            margin-top: 28px; padding: 14px 40px;
            background: var(--rev-color); color: #fff; border: none;
            border-radius: 6px; font-family: 'Orbitron', sans-serif;
            font-size: 12px; font-weight: 800;
            letter-spacing: 0.1em; text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 4px 20px var(--rev-color);
        }
        @keyframes popIn {
            0% { transform: scale(0.3); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Flash */
        .flash {
            position: fixed; inset: 0;
            pointer-events: none; z-index: 99; opacity: 0;
        }
        .flash.on { animation: flashFx 0.5s ease-out forwards; }
        @keyframes flashFx { 0% { opacity: 0.9; } 100% { opacity: 0; } }
    </style>
</head>
<body>
    <div class="header">
        <h1>⚡ RODA DE INVOCAÇÃO</h1>
        <a href="index.html">VOLTAR</a>
    </div>

    <div class="counter" id="counter">1 / 20</div>

    <div class="carousel-wrapper">
        <div class="bg-glow" id="bg-glow"></div>
        <div class="carousel-track" id="track"></div>
        <div class="info-panel">
            <div class="info-name" id="info-name">Primal Force</div>
            <div class="info-sub" id="info-sub">Arrasta para escolher</div>
            <div class="info-type" id="info-type"></div>
        </div>
    </div>

    <div class="swipe-arrow left">‹</div>
    <div class="swipe-arrow right">›</div>
    <div class="hint">Arrasta ou toca para selecionar • Toca duas vezes para invocar</div>

    <div class="flash" id="flash"></div>
    <div class="reveal" id="reveal">
        <div class="reveal-card">
            <div class="reveal-ring">
                <div class="reveal-avatar" id="rev-avatar"></div>
            </div>
            <div class="reveal-name" id="rev-name"></div>
            <div class="reveal-ranger" id="rev-ranger"></div>
            <div class="reveal-dino" id="rev-dino"></div>
            <button class="reveal-btn" id="rev-btn">ENTRAR NO CHAT</button>
        </div>
    </div>

    <script src="primalforce-robots.js"></script>
    <script>
        const track = document.getElementById('track');
        const bgGlow = document.getElementById('bg-glow');
        const infoName = document.getElementById('info-name');
        const infoSub = document.getElementById('info-sub');
        const infoType = document.getElementById('info-type');
        const flashEl = document.getElementById('flash');
        const revealEl = document.getElementById('reveal');
        const counterEl = document.getElementById('counter');

        const allRobots = [...RANGERS_PRINCIPAIS, ...OUTROS_RANGERS];
        const total = allRobots.length;
        const ITEM_SPACING = 130;
        const CENTER_X = window.innerWidth / 2;

        let selectedIndex = 0;
        let scrollX = 0;
        let targetScrollX = 0;
        let isDragging = false;
        let dragStartX = 0;
        let dragStartScroll = 0;
        let lastX = 0;
        let lastT = 0;
        let dragVel = 0;
        let items = [];

        // Build items
        function build() {
            track.innerHTML = '';
            items = [];
            allRobots.forEach((id, i) => {
                const r = PRIMAL_FORCE[id];
                const el = document.createElement('div');
                el.className = 'carousel-item';
                el.dataset.index = i;
                el.style.setProperty('--item-color', r.cor);

                el.innerHTML = `
                    <div class="item-ring">
                        <div class="item-icon">
                            ${r.imagem ? `<img src="${r.imagem}" alt="${r.nome}" onerror="this.parentElement.textContent='${r.nome[0]}'">` : r.nome[0]}
                        </div>
                    </div>
                `;

                el.addEventListener('click', () => {
                    if (Math.abs(targetScrollX - scrollX) < 2) {
                        handleTap(i);
                    }
                });

                track.appendChild(el);
                items.push(el);
            });
        }

        function update() {
            const vw = window.innerWidth;
            const cx = vw / 2;

            items.forEach((el, i) => {
                const itemX = i * ITEM_SPACING - scrollX;
                const distFromCenter = Math.abs(itemX - cx);
                const maxDist = vw * 0.6;

                const normDist = Math.min(distFromCenter / maxDist, 1);

                const scale = 1.0 - normDist * 0.55;
                const opacity = 1.0 - normDist * 0.7;
                const zIndex = Math.round((1 - normDist) * 10);

                const x = cx + (itemX - cx) * 0.85;

                el.style.left = (x - 60) + 'px';
                el.style.top = (100 - (1 - normDist) * 20) + 'px';
                el.style.transform = `scale(${scale})`;
                el.style.opacity = opacity;
                el.style.zIndex = zIndex;

                el.classList.toggle('selected', normDist < 0.08);
            });

            // Find closest to center
            let closestIdx = 0;
            let closestDist = Infinity;
            items.forEach((el, i) => {
                const itemX = i * ITEM_SPACING - scrollX;
                const dist = Math.abs(itemX - cx);
                if (dist < closestDist) {
                    closestDist = dist;
                    closestIdx = i;
                }
            });

            if (closestIdx !== selectedIndex) {
                selectedIndex = closestIdx;
                const r = PRIMAL_FORCE[allRobots[selectedIndex]];
                infoName.textContent = r.nome;
                infoName.style.color = r.cor;
                infoSub.textContent = `Ranger: ${r.ranger} • ${r.dino}`;
                infoType.textContent = `${r.supportType.toUpperCase()} • ${r.dino}`;
                bgGlow.style.setProperty('--glow-color', r.cor + '20');
                counterEl.textContent = `${selectedIndex + 1} / ${total}`;
            }
        }

        // Snap to nearest
        function snapToNearest() {
            const cx = window.innerWidth / 2;
            let closestIdx = 0;
            let closestDist = Infinity;
            items.forEach((el, i) => {
                const itemX = i * ITEM_SPACING - scrollX;
                const dist = Math.abs(itemX - cx);
                if (dist < closestDist) {
                    closestDist = dist;
                    closestIdx = i;
                }
            });
            scrollToIndex(closestIdx);
        }

        function scrollToIndex(idx) {
            const cx = window.innerWidth / 2;
            targetScrollX = idx * ITEM_SPACING - cx + ITEM_SPACING / 2;
            animateScroll();
        }

        function animateScroll() {
            const diff = targetScrollX - scrollX;
            if (Math.abs(diff) < 0.5) {
                scrollX = targetScrollX;
                update();
                return;
            }
            scrollX += diff * 0.15;
            update();
            requestAnimationFrame(animateScroll);
        }

        // Tap to select
        let lastTapIdx = -1;
        let lastTapTime = 0;
        function handleTap(idx) {
            const now = Date.now();
            if (idx === lastTapIdx && now - lastTapTime < 400) {
                invocar(idx);
            } else {
                scrollToIndex(idx);
            }
            lastTapIdx = idx;
            lastTapTime = now;
        }

        // Drag
        track.addEventListener('mousedown', e => {
            isDragging = true;
            dragStartX = e.clientX;
            dragStartScroll = scrollX;
            lastX = e.clientX;
            lastT = performance.now();
            dragVel = 0;
        });
        document.addEventListener('mousemove', e => {
            if (!isDragging) return;
            const dx = e.clientX - dragStartX;
            scrollX = dragStartScroll - dx;
            const now = performance.now();
            const dt = now - lastT;
            if (dt > 0) dragVel = -(e.clientX - lastX) / dt * 16;
            lastX = e.clientX;
            lastT = now;
            update();
        });
        document.addEventListener('mouseup', () => {
            if (!isDragging) return;
            isDragging = false;
            if (Math.abs(dragVel) > 2) {
                targetScrollX = scrollX + dragVel * 15;
                targetScrollX = Math.max(0, Math.min(targetScrollX, (total - 1) * ITEM_SPACING));
                animateScroll();
            } else {
                snapToNearest();
            }
        });

        // Touch
        track.addEventListener('touchstart', e => {
            isDragging = true;
            dragStartX = e.touches[0].clientX;
            dragStartScroll = scrollX;
            lastX = dragStartX;
            lastT = performance.now();
            dragVel = 0;
        }, { passive: true });
        document.addEventListener('touchmove', e => {
            if (!isDragging) return;
            const x = e.touches[0].clientX;
            const dx = x - dragStartX;
            scrollX = dragStartScroll - dx;
            const now = performance.now();
            const dt = now - lastT;
            if (dt > 0) dragVel = -(x - lastX) / dt * 16;
            lastX = x;
            lastT = now;
            update();
        }, { passive: true });
        document.addEventListener('touchend', () => {
            if (!isDragging) return;
            isDragging = false;
            if (Math.abs(dragVel) > 2) {
                targetScrollX = scrollX + dragVel * 15;
                targetScrollX = Math.max(0, Math.min(targetScrollX, (total - 1) * ITEM_SPACING));
                animateScroll();
            } else {
                snapToNearest();
            }
        });

        // Keyboard
        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft') scrollToIndex(Math.max(0, selectedIndex - 1));
            else if (e.key === 'ArrowRight') scrollToIndex(Math.min(total - 1, selectedIndex + 1));
            else if (e.key === 'Enter') invocar(selectedIndex);
        });

        // Invocar
        let invocando = false;
        function invocar(idx) {
            if (invocando) return;
            invocando = true;
            const r = PRIMAL_FORCE[allRobots[idx]];

            // Flash
            flashEl.style.background = r.cor;
            flashEl.classList.add('on');
            setTimeout(() => flashEl.classList.remove('on'), 500);

            // Reveal
            setTimeout(() => {
                const av = document.getElementById('rev-avatar');
                av.style.background = r.cor;
                av.innerHTML = r.imagem
                    ? `<img src="${r.imagem}" alt="" onerror="this.textContent='${r.nome[0]}'">`
                    : r.nome[0];

                document.getElementById('rev-name').textContent = r.nome;
                document.getElementById('rev-name').style.color = r.cor;
                document.getElementById('rev-ranger').textContent = `Ranger: ${r.ranger}`;
                document.getElementById('rev-dino').textContent = `${r.supportType.toUpperCase()} • ${r.dino}`;
                document.getElementById('rev-btn').style.background = r.cor;
                document.getElementById('rev-btn').style.boxShadow = `0 4px 20px ${r.cor}`;
                document.querySelector('.reveal-ring').style.setProperty('--rev-color', r.cor);

                revealEl.classList.add('on');
                document.getElementById('rev-btn').onclick = () => {
                    localStorage.setItem('summonedRobot', allRobots[idx]);
                    window.location.href = `index.html?robot=${allRobots[idx]}`;
                };
            }, 350);
        }

        // Init
        build();
        scrollToIndex(0);
    </script>
</body>
</html>
