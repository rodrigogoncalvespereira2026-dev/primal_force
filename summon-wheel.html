<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a1a">
    <title>Primal Force — Roda de Invocação</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --power-dark: #0a0a1a; --power-gold: #FFD700; }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: 'Rajdhani', sans-serif;
            background: #000; color: #e8e8f0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            user-select: none; -webkit-user-select: none;
        }

        .header {
            position: fixed; top: 0; left: 0; right: 0;
            padding: 14px 20px; display: flex; align-items: center; gap: 12px;
            background: rgba(0,0,0,0.95);
            border-bottom: 1px solid rgba(255,215,0,0.08); z-index: 50;
        }
        .header h1 {
            font-family: 'Orbitron', sans-serif; font-size: 13px;
            font-weight: 700; letter-spacing: 0.1em; color: var(--power-gold);
        }
        .header a {
            margin-left: auto; font-family: 'Orbitron', sans-serif;
            font-size: 10px; font-weight: 700; color: var(--power-gold);
            text-decoration: none; padding: 7px 14px;
            border: 1px solid rgba(255,215,0,0.2); border-radius: 4px;
            transition: all 0.2s;
        }
        .header a:hover { background: rgba(255,215,0,0.1); }

        /* 3D Scene */
        .scene {
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            perspective: 900px;
        }

        /* The ring */
        .wheel {
            position: relative;
            width: 160px; height: 160px;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        /* Each robot on the ring */
        .wheel-item {
            position: absolute;
            width: 100px; height: 100px;
            left: 30px; top: 30px;
            transform-style: preserve-3d;
        }

        .wheel-item-inner {
            width: 100%; height: 100%;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: rgba(10,10,25,0.95);
            border: 3px solid transparent;
            font-size: 12px; font-weight: 800;
            font-family: 'Orbitron', sans-serif; color: #fff;
            cursor: pointer;
            transition: border-color 0.4s, box-shadow 0.4s;
            overflow: hidden;
        }
        .wheel-item-inner img {
            width: 100%; height: 100%;
            border-radius: 50%; object-fit: cover;
        }

        /* Selected (front) */
        .wheel-item.front .wheel-item-inner {
            border-color: var(--item-color);
            box-shadow: 0 0 25px var(--item-color),
                        0 0 50px color-mix(in srgb, var(--item-color) 35%, transparent),
                        0 0 80px color-mix(in srgb, var(--item-color) 15%, transparent);
        }

        /* Info */
        .info-panel {
            position: fixed;
            bottom: 120px;
            text-align: center; width: 100%;
        }
        .info-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 26px; font-weight: 900;
            letter-spacing: 0.12em; text-transform: uppercase;
            transition: color 0.3s;
        }
        .info-sub {
            font-size: 13px; color: rgba(255,255,255,0.4); margin-top: 4px;
        }
        .info-type {
            font-size: 10px; font-family: 'Orbitron', sans-serif;
            letter-spacing: 0.1em; text-transform: uppercase;
            margin-top: 6px; opacity: 0.5;
        }
        .hint {
            font-size: 11px; color: rgba(255,255,255,0.15);
            margin-top: 14px;
        }

        /* Arrows */
        .arrow {
            position: fixed; top: 50%; transform: translateY(-50%);
            width: 50px; height: 50px;
            border-radius: 50%;
            background: rgba(255,215,0,0.06);
            border: 1px solid rgba(255,215,0,0.15);
            color: var(--power-gold); font-size: 22px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 20; transition: all 0.2s;
        }
        .arrow:hover { background: rgba(255,215,0,0.12); }
        .arrow.left { left: 20px; }
        .arrow.right { right: 20px; }

        /* Counter */
        .counter {
            position: fixed; top: 60px; right: 20px;
            font-family: 'Orbitron', sans-serif;
            font-size: 10px; color: rgba(255,255,255,0.2); z-index: 50;
        }

        /* Reveal overlay */
        .reveal {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0);
            display: none; align-items: center; justify-content: center;
            z-index: 100; transition: background 0.4s;
        }
        .reveal.on { display: flex; background: rgba(0,0,0,0.92); }
        .reveal-card { text-align: center; animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .reveal-ring {
            width: 130px; height: 130px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 16px;
            border: 4px solid var(--rev-color);
            box-shadow: 0 0 40px var(--rev-color), 0 0 80px color-mix(in srgb, var(--rev-color) 50%, transparent);
        }
        .reveal-avatar {
            width: 110px; height: 110px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 44px; font-weight: 900;
            font-family: 'Orbitron', sans-serif; color: #fff;
            background: rgba(10,10,25,0.95);
        }
        .reveal-avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        .reveal-name {
            font-family: 'Orbitron', sans-serif; font-size: 28px;
            font-weight: 900; letter-spacing: 0.12em; text-transform: uppercase;
            color: var(--rev-color);
        }
        .reveal-ranger { font-size: 14px; color: rgba(255,255,255,0.4); margin-top: 4px; }
        .reveal-dino {
            font-size: 10px; font-family: 'Orbitron', sans-serif;
            letter-spacing: 0.1em; text-transform: uppercase; margin-top: 6px;
            color: var(--rev-color); opacity: 0.6;
        }
        .reveal-btn {
            margin-top: 28px; padding: 14px 40px;
            background: var(--rev-color); color: #fff; border: none;
            border-radius: 6px; font-family: 'Orbitron', sans-serif;
            font-size: 12px; font-weight: 800;
            letter-spacing: 0.1em; text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 4px 20px var(--rev-color);
        }
        @keyframes popIn {
            0% { transform: scale(0.3); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .flash {
            position: fixed; inset: 0;
            pointer-events: none; z-index: 99; opacity: 0;
        }
        .flash.on { animation: flashFx 0.5s ease-out forwards; }
        @keyframes flashFx { 0% { opacity: 0.9; } 100% { opacity: 0; } }

        .reveal-close {
            position: absolute; top: 20px; right: 20px;
            width: 36px; height: 36px; border-radius: 50%;
            background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15);
            color: #fff; font-size: 18px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.2s;
        }
        .reveal-close:hover { background: rgba(255,255,255,0.12); }

        .pulse-ring {
            position: absolute; inset: -8px; border-radius: 50%;
            border: 2px solid var(--item-color);
            animation: pulseRing 1.5s ease-out infinite;
            pointer-events: none;
        }
        @keyframes pulseRing {
            0% { transform: scale(1); opacity: 0.6; }
            100% { transform: scale(1.3); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>⚡ RODA DE INVOCAÇÃO</h1>
        <a href="index.html">VOLTAR</a>
    </div>
    <div class="counter" id="counter">1 / 20</div>

    <div class="scene" id="scene">
        <div class="wheel" id="wheel"></div>
    </div>

    <div class="arrow left" id="arrow-left">‹</div>
    <div class="arrow right" id="arrow-right">›</div>

    <div class="info-panel">
        <div class="info-name" id="info-name">Primal Force</div>
        <div class="info-sub" id="info-sub">Arrasta ou usa as setas</div>
        <div class="info-type" id="info-type"></div>
        <div class="hint">Toca no robô da frente para invocar</div>
    </div>

    <div class="flash" id="flash"></div>
    <div class="reveal" id="reveal">
        <button class="reveal-close" id="rev-close">✕</button>
        <div class="reveal-card">
            <div class="reveal-ring">
                <div class="reveal-avatar" id="rev-avatar"></div>
            </div>
            <div class="reveal-name" id="rev-name"></div>
            <div class="reveal-ranger" id="rev-ranger"></div>
            <div class="reveal-dino" id="rev-dino"></div>
            <button class="reveal-btn" id="rev-btn">ENTRAR NO CHAT</button>
        </div>
    </div>

    <script src="primalforce-robots.js"></script>
    <script>
        const wheelEl = document.getElementById('wheel');
        const flashEl = document.getElementById('flash');
        const revealEl = document.getElementById('reveal');
        const infoName = document.getElementById('info-name');
        const infoSub = document.getElementById('info-sub');
        const infoType = document.getElementById('info-type');
        const counterEl = document.getElementById('counter');

        const allRobots = [...RANGERS_PRINCIPAIS, ...OUTROS_RANGERS];
        const total = allRobots.length;
        const ANGLE_STEP = 360 / total;
        const RING_RADIUS = 300;

        let currentAngle = 0;
        let targetAngle = 0;
        let selectedIndex = 0;
        let animating = false;

        // Build 3D ring
        function build() {
            wheelEl.innerHTML = '';
            allRobots.forEach((id, i) => {
                const r = PRIMAL_FORCE[id];
                const angle = ANGLE_STEP * i;

                const item = document.createElement('div');
                item.className = 'wheel-item';
                item.dataset.index = i;

                const inner = document.createElement('div');
                inner.className = 'wheel-item-inner';
                inner.style.setProperty('--item-color', r.cor);

                if (r.imagem) {
                    const img = document.createElement('img');
                    img.src = r.imagem; img.alt = r.nome;
                    img.onerror = () => { inner.textContent = r.nome[0]; };
                    inner.appendChild(img);
                } else {
                    inner.textContent = r.nome[0];
                }

                inner.addEventListener('click', () => {
                    if (i === selectedIndex && !animating) {
                        invocar(i);
                    } else {
                        rotateTo(i);
                    }
                });

                item.appendChild(inner);
                wheelEl.appendChild(item);
            });
            updatePositions();
        }

        function updatePositions() {
            const items = wheelEl.querySelectorAll('.wheel-item');

            items.forEach((item, i) => {
                const angle = (ANGLE_STEP * i + currentAngle) * Math.PI / 180;
                const x = Math.sin(angle) * RING_RADIUS;
                const z = Math.cos(angle) * RING_RADIUS;
                const scale = (z + RING_RADIUS) / (2 * RING_RADIUS);
                const opacity = 0.15 + scale * 0.85;
                const yPos = -z * 0.12;

                item.style.transform = `translateX(${x}px) translateY(${yPos}px) scale(${0.3 + scale * 0.7})`;
                item.style.opacity = opacity;
                item.style.zIndex = Math.round(scale * 100);

                const normalizedZ = (z + RING_RADIUS) / (2 * RING_RADIUS);
                const isFront = normalizedZ > 0.92;
                const wasFront = item.classList.contains('front');
                item.classList.toggle('front', isFront);

                // Add/remove pulse ring
                let pulse = item.querySelector('.pulse-ring');
                if (isFront && !pulse) {
                    pulse = document.createElement('div');
                    pulse.className = 'pulse-ring';
                    item.appendChild(pulse);
                } else if (!isFront && pulse) {
                    pulse.remove();
                }

                if (isFront && selectedIndex !== i) {
                    selectedIndex = i;
                    const r = PRIMAL_FORCE[allRobots[i]];
                    infoName.textContent = r.nome;
                    infoName.style.color = r.cor;
                    infoSub.textContent = `Ranger: ${r.ranger} • ${r.dino}`;
                    infoType.textContent = `${r.supportType.toUpperCase()} • ${r.dino}`;
                    counterEl.textContent = `${i + 1} / ${total}`;
                }
            });
        }

        function rotateTo(index) {
            if (animating) return;
            animating = true;
            const target = -index * ANGLE_STEP;
            let diff = target - currentAngle;
            diff = ((diff % 360) + 540) % 360 - 180;

            const start = currentAngle;
            const end = currentAngle + diff;
            const duration = 600;
            const t0 = performance.now();

            function anim(t) {
                const p = Math.min((t - t0) / duration, 1);
                const ease = 1 - Math.pow(1 - p, 3);
                currentAngle = start + diff * ease;
                updatePositions();
                if (p < 1) {
                    requestAnimationFrame(anim);
                } else {
                    currentAngle = end;
                    animating = false;
                    updatePositions();
                }
            }
            requestAnimationFrame(anim);
        }

        // Arrows
        document.getElementById('arrow-left').addEventListener('click', () => {
            rotateTo((selectedIndex - 1 + total) % total);
        });
        document.getElementById('arrow-right').addEventListener('click', () => {
            rotateTo((selectedIndex + 1) % total);
        });

        // Keyboard
        document.addEventListener('keydown', e => {
            if (revealEl.classList.contains('on')) {
                if (e.key === 'Escape') closeReveal();
                return;
            }
            if (e.key === 'ArrowLeft') rotateTo((selectedIndex - 1 + total) % total);
            else if (e.key === 'ArrowRight') rotateTo((selectedIndex + 1) % total);
            else if (e.key === 'Enter') invocar(selectedIndex);
        });

        // Resize handler
        window.addEventListener('resize', () => updatePositions());

        // Drag
        let dragging = false;
        let dragStartX = 0;
        let dragStartAngle = 0;
        let lastX = 0;
        let lastT = 0;
        let dragVel = 0;

        wheelEl.addEventListener('mousedown', e => {
            dragging = true;
            dragStartX = e.clientX;
            dragStartAngle = currentAngle;
            lastX = e.clientX;
            lastT = performance.now();
            dragVel = 0;
        });
        document.addEventListener('mousemove', e => {
            if (!dragging) return;
            const dx = e.clientX - dragStartX;
            currentAngle = dragStartAngle + dx * 0.5;
            const now = performance.now();
            const dt = now - lastT;
            if (dt > 0) dragVel = (e.clientX - lastX) / dt * 16;
            lastX = e.clientX;
            lastT = now;
            updatePositions();
        });
        document.addEventListener('mouseup', () => {
            if (!dragging) return;
            dragging = false;
            snapToNearest();
        });

        function snapToNearest() {
            let idx;
            if (Math.abs(dragVel) > 2) {
                const angleDelta = dragVel * 8;
                const newTarget = currentAngle + angleDelta;
                idx = Math.round(-newTarget / ANGLE_STEP);
            } else {
                idx = Math.round(-currentAngle / ANGLE_STEP);
            }
            idx = ((idx % total) + total) % total;
            rotateTo(idx);
            dragVel = 0;
        }

        // Touch
        wheelEl.addEventListener('touchstart', e => {
            dragging = true;
            dragStartX = e.touches[0].clientX;
            dragStartAngle = currentAngle;
            lastX = dragStartX;
            lastT = performance.now();
            dragVel = 0;
        }, { passive: true });
        document.addEventListener('touchmove', e => {
            if (!dragging) return;
            e.preventDefault();
            const x = e.touches[0].clientX;
            const dx = x - dragStartX;
            currentAngle = dragStartAngle + dx * 0.5;
            const now = performance.now();
            const dt = now - lastT;
            if (dt > 0) dragVel = (x - lastX) / dt * 16;
            lastX = x;
            lastT = now;
            updatePositions();
        }, { passive: false });
        document.addEventListener('touchend', () => {
            if (!dragging) return;
            dragging = false;
            snapToNearest();
        });

        // Invocar
        let invocando = false;
        function invocar(idx) {
            if (invocando) return;
            invocando = true;
            const r = PRIMAL_FORCE[allRobots[idx]];

            flashEl.style.background = r.cor;
            flashEl.classList.add('on');
            setTimeout(() => flashEl.classList.remove('on'), 500);

            setTimeout(() => {
                const av = document.getElementById('rev-avatar');
                av.style.background = r.cor;
                av.innerHTML = r.imagem
                    ? `<img src="${r.imagem}" alt="" onerror="this.textContent='${r.nome[0]}'">`
                    : r.nome[0];
                document.getElementById('rev-name').textContent = r.nome;
                document.getElementById('rev-name').style.color = r.cor;
                document.getElementById('rev-ranger').textContent = `Ranger: ${r.ranger}`;
                document.getElementById('rev-dino').textContent = `${r.supportType.toUpperCase()} • ${r.dino}`;
                document.getElementById('rev-btn').style.background = r.cor;
                document.getElementById('rev-btn').style.boxShadow = `0 4px 20px ${r.cor}`;
                document.querySelector('.reveal-ring').style.setProperty('--rev-color', r.cor);
                revealEl.classList.add('on');
                document.getElementById('rev-btn').onclick = () => {
                    localStorage.setItem('summonedRobot', allRobots[idx]);
                    window.location.href = `index.html?robot=${allRobots[idx]}`;
                };
            }, 350);
        }

        function closeReveal() {
            revealEl.classList.remove('on');
            invocando = false;
        }
        document.getElementById('rev-close').addEventListener('click', closeReveal);
        revealEl.addEventListener('click', e => {
            if (e.target === revealEl) closeReveal();
        });

        build();
    </script>
</body>
</html>
