<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Primal Force IA">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>Primal Force — Robôs IA</title>
    <link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR4nMNgYAAAAAMAASsJTYQAAAAASUVORK5CYII=">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Rajdhani', sans-serif; -webkit-tap-highlight-color: transparent; }
        :root {
            color-scheme: dark;
            --power-gold: #FFD700;
            --power-red: #FF1744;
            --power-blue: #2979FF;
            --power-green: #00E676;
            --power-yellow: #FFEA00;
            --power-pink: #FF4081;
            --power-purple: #D500F9;
            --power-black: #0a0a1a;
            --power-silver: #B0BEC5;
            --grid-line: rgba(255,215,0,0.06);
        }
        body {
            background: var(--power-black);
            color: #e8e8f0;
            height: 100vh; height: 100dvh;
            display: flex; flex-direction: column;
            overflow: hidden;
            background-image:
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: gridScroll 20s linear infinite;
        }
        @keyframes gridScroll { 0% { background-position: 0 0; } 100% { background-position: 40px 40px; } }

        /* ============ HEADER ============ */
        header {
            background: linear-gradient(135deg, #0d0d2b 0%, #1a0a2e 50%, #0d0d2b 100%);
            padding: 12px 20px;
            padding-top: max(12px, env(safe-area-inset-top));
            display: flex; align-items: center; gap: 14px;
            border-bottom: 2px solid;
            border-image: linear-gradient(90deg, transparent, var(--power-gold), var(--power-red), var(--power-gold), transparent) 1;
            flex-wrap: wrap;
            position: relative;
            overflow: hidden;
        }
        header::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 200%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,215,0,0.03), transparent);
            animation: headerSweep 4s ease-in-out infinite;
        }
        @keyframes headerSweep { 0%,100% { transform: translateX(-50%); } 50% { transform: translateX(50%); } }

        .logo-bolt {
            width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            position: relative;
        }
        .logo-bolt svg { width: 32px; height: 32px; filter: drop-shadow(0 0 8px var(--power-gold)); }
        header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 17px; font-weight: 800;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            background: linear-gradient(135deg, var(--power-gold), #fff, var(--power-gold));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: none;
            white-space: nowrap;
        }
        .header-tag {
            font-family: 'Orbitron', sans-serif;
            font-size: 8px; letter-spacing: 0.15em;
            color: var(--power-gold); opacity: 0.6;
            text-transform: uppercase;
            position: absolute; top: 6px; right: 20px;
        }

        #robot-list {
            display: flex; gap: 6px; margin-left: auto; overflow-x: auto;
            -webkit-overflow-scrolling: touch; scrollbar-width: none;
            padding: 4px 0; flex-wrap: nowrap;
        }
        #robot-list::-webkit-scrollbar { display: none; }
        .secao-titulo {
            font-family: 'Orbitron', sans-serif;
            font-size: 8px; font-weight: 700; letter-spacing: 0.12em;
            text-transform: uppercase; color: var(--power-gold); opacity: 0.5;
            padding: 4px 8px; flex-shrink: 0; align-self: center;
            border-left: 1px solid rgba(255,215,0,0.15);
            margin-left: 6px;
        }
        .secao-titulo:first-child { border-left: none; margin-left: 0; }

        #robot-list button {
            padding: 7px 14px; border-radius: 4px;
            border: 1px solid rgba(255,215,0,0.15);
            background: rgba(255,215,0,0.04);
            color: #c0c0d0; cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-size: 10px; font-weight: 600;
            letter-spacing: 0.06em; text-transform: uppercase;
            transition: all 0.3s;
            flex-shrink: 0; min-height: 32px;
            white-space: nowrap;
            position: relative;
            clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
        }
        #robot-list button::before {
            content: '';
            position: absolute; inset: 0;
            background: var(--cor-robot);
            opacity: 0; transition: opacity 0.3s;
            clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
        }
        #robot-list button:hover::before { opacity: 0.15; }
        #robot-list button.ativo {
            color: #fff;
            border-color: var(--cor-robot);
            box-shadow: 0 0 12px color-mix(in srgb, var(--cor-robot) 40%, transparent),
                        inset 0 0 20px color-mix(in srgb, var(--cor-robot) 20%, transparent);
        }
        #robot-list button.ativo::before { opacity: 0.25; }
        #robot-list button span { position: relative; z-index: 1; }

        /* ============ MAIN LAYOUT ============ */
        #main { flex: 1; display: flex; overflow: hidden; }

        /* ============ FACE PANEL ============ */
        #face-panel {
            width: 220px;
            background: linear-gradient(180deg, #0a0a2a 0%, #0d0d2b 50%, #0a0a1a 100%);
            border-right: 2px solid;
            border-image: linear-gradient(180deg, var(--power-gold), transparent) 1;
            display: flex; flex-direction: column; align-items: center;
            padding: 20px 16px; gap: 8px;
            position: relative;
            overflow: hidden;
        }
        #face-panel::before {
            content: '';
            position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 200px; height: 200px;
            background: radial-gradient(circle, color-mix(in srgb, var(--robot-cor) 12%, transparent) 0%, transparent 70%);
            pointer-events: none;
        }


        .morphin-badge {
            width: 150px; height: 150px;
            position: relative;
            display: flex; align-items: center; justify-content: center;
        }
        .morphin-badge .ring {
            position: absolute; inset: 0;
            border: 2px solid var(--cor-robot);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            animation: hexRotate 8s linear infinite;
        }
        .morphin-badge .ring::before {
            content: '';
            position: absolute; inset: 4px;
            border: 1px solid color-mix(in srgb, var(--cor-robot) 40%, transparent);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        }
        @keyframes hexRotate { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .robot-avatar {
            width: 120px; height: 120px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 48px; font-weight: 900;
            color: #fff;
            position: relative;
            z-index: 1;
            overflow: hidden;
            animation: robotFlutuar 3s ease-in-out infinite, robotBrilho 3.5s ease-in-out infinite;
        }
        .robot-avatar img {
            width: 100%; height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .robot-avatar::after {
            content: '';
            position: absolute; inset: -4px;
            border-radius: 50%;
            border: 2px solid var(--cor-robot);
            opacity: 0.4;
            animation: ringPulse 2s ease-in-out infinite;
        }
        @keyframes ringPulse { 0%,100% { transform: scale(1); opacity: 0.4; } 50% { transform: scale(1.05); opacity: 0.7; } }

        @keyframes robotFlutuar { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        @keyframes robotBrilho {
            0%,100% { box-shadow: 0 0 20px 4px color-mix(in srgb, var(--robot-cor) 40%, transparent); }
            50% { box-shadow: 0 0 40px 12px color-mix(in srgb, var(--robot-cor) 70%, transparent); }
        }
        @keyframes robotFalar {
            0%,100% { transform: translateY(0) scale(1); }
            25% { transform: translateY(-4px) scale(1.04, 0.97); }
            50% { transform: translateY(-2px) scale(0.97, 1.03); }
            75% { transform: translateY(-3px) scale(1.02, 0.98); }
        }
        @keyframes robotOuvir { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }

        #face-panel[data-estado="ouvir"] .robot-avatar { animation: robotOuvir 1.6s ease-in-out infinite, robotBrilho 2s ease-in-out infinite; }
        #face-panel[data-estado="pensar"] .robot-avatar { animation: robotFlutuar 2s ease-in-out infinite, robotBrilho 2.5s ease-in-out infinite; }
        #face-panel[data-estado="falar"] .robot-avatar { animation: robotFalar 0.5s ease-in-out infinite, robotBrilho 1s ease-in-out infinite; }

        .robot-info { text-align: center; margin-top: 4px; position: relative; z-index: 1; }
        .robot-nome {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px; font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .robot-ranger {
            font-size: 12px; color: #8090b0;
            margin-top: 2px; letter-spacing: 0.04em;
        }
        .robot-suporte {
            font-family: 'Orbitron', sans-serif;
            font-size: 9px; letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-top: 6px;
            padding: 4px 12px;
            border-radius: 2px;
            background: rgba(255,215,0,0.06);
            border: 1px solid color-mix(in srgb, var(--cor-robot) 30%, transparent);
            display: inline-block;
        }
        .estado-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 10px; letter-spacing: 0.1em;
            color: var(--power-gold); opacity: 0.7;
            margin-top: 8px;
            text-transform: uppercase;
        }

        /* ============ CHAT ============ */
        #chat {
            flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
            padding: 24px; display: flex; flex-direction: column; gap: 14px;
        }

        .msg {
            max-width: 75%; padding: 14px 18px;
            border-radius: 4px; line-height: 1.5;
            white-space: pre-wrap; word-break: break-word;
            position: relative;
        }
        .msg.user {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--robot-cor), color-mix(in srgb, var(--robot-cor) 70%, #000));
            color: #fff;
            border: 1px solid color-mix(in srgb, var(--robot-cor) 60%, transparent);
            clip-path: polygon(0% 0%, calc(100% - 10px) 0%, 100% 10px, 100% 100%, 0% 100%);
        }
        .msg.robot {
            align-self: flex-start;
            background: rgba(15,15,40,0.9);
            border: 1px solid rgba(255,215,0,0.1);
            clip-path: polygon(10px 0%, 100% 0%, 100% 100%, 0% 100%, 0% 10px);
        }
        .msg.robot::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, var(--cor-robot), transparent);
            opacity: 0.4;
        }
        .msg.robot .linha-robot { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
        .msg.robot .avatar-mini {
            width: 26px; height: 26px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 10px; font-weight: 800; color: #fff;
            flex-shrink: 0;
            overflow: hidden;
            box-shadow: 0 0 8px color-mix(in srgb, var(--cor-robot) 40%, transparent);
        }
        .msg.robot .avatar-mini img {
            width: 100%; height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }
        .msg.robot .nome-robot {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700; font-size: 11px;
            letter-spacing: 0.06em; text-transform: uppercase;
        }
        .msg.sistema {
            align-self: center;
            background: rgba(255,215,0,0.06);
            color: var(--power-gold);
            font-family: 'Orbitron', sans-serif;
            font-size: 10px; letter-spacing: 0.08em;
            padding: 8px 16px; border-radius: 2px;
            text-align: center;
            border: 1px solid rgba(255,215,0,0.1);
            text-transform: uppercase;
        }
        .digitando {
            align-self: flex-start;
            background: rgba(15,15,40,0.9);
            border: 1px solid rgba(255,215,0,0.1);
            padding: 14px 18px; border-radius: 4px;
            clip-path: polygon(10px 0%, 100% 0%, 100% 100%, 0% 100%, 0% 10px);
        }
        .digitando span {
            font-family: 'Orbitron', sans-serif;
            animation: piscar 1s infinite;
        }
        @keyframes piscar { 0%,100% { opacity: 0.2; } 50% { opacity: 1; } }

        /* ============ FOOTER ============ */
        footer {
            display: flex; gap: 10px;
            padding: 14px 20px;
            padding-bottom: max(14px, env(safe-area-inset-bottom));
            background: linear-gradient(0deg, #0a0a2a, #0d0d2b);
            border-top: 2px solid;
            border-image: linear-gradient(90deg, transparent, var(--power-gold), var(--power-red), var(--power-gold), transparent) 1;
            position: relative;
        }
        footer::before {
            content: '';
            position: absolute; top: -20px; left: 0; right: 0; height: 20px;
            background: linear-gradient(0deg, transparent, rgba(255,215,0,0.02));
            pointer-events: none;
        }

        #input {
            flex: 1;
            background: rgba(15,15,40,0.8);
            border: 1px solid rgba(255,215,0,0.12);
            color: #e8e8f0;
            padding: 12px 18px; border-radius: 4px;
            outline: none; font-size: 15px; min-width: 0;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 500;
            transition: all 0.3s;
            caret-color: var(--power-gold);
        }
        #input::placeholder { color: #5a6080; font-weight: 400; }
        #input:focus {
            border-color: var(--power-gold);
            box-shadow: 0 0 0 2px rgba(255,215,0,0.1), 0 0 20px rgba(255,215,0,0.05);
            background: rgba(20,20,50,0.9);
        }

        #enviar {
            background: linear-gradient(135deg, var(--power-red), #b71c1c);
            color: #fff; border: none;
            padding: 12px 24px; border-radius: 4px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-size: 11px; font-weight: 700;
            letter-spacing: 0.1em; text-transform: uppercase;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
        }
        #enviar::before {
            content: '';
            position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg);
            transition: all 0.5s;
        }
        #enviar:hover::before { left: 100%; }
        #enviar:hover { box-shadow: 0 0 20px rgba(255,23,68,0.4); transform: translateY(-1px); }
        #enviar:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

        #voz-toggle, #microfone {
            background: rgba(15,15,40,0.8);
            border: 1px solid rgba(255,215,0,0.12);
            color: #e8e8f0;
            width: 46px; height: 46px; border-radius: 50%;
            cursor: pointer; font-size: 18px;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s; flex-shrink: 0;
        }
        #voz-toggle:hover, #microfone:hover { border-color: var(--power-gold); box-shadow: 0 0 12px rgba(255,215,0,0.15); }
        #voz-toggle.desligado { opacity: 0.3; }
        #microfone.ouvindo {
            background: var(--power-green);
            border-color: var(--power-green);
            color: #0a0a1a;
            animation: morphinPulse 1s infinite;
        }
        @keyframes morphinPulse {
            0%,100% { box-shadow: 0 0 0 0 rgba(0,230,118,0.4); }
            50% { box-shadow: 0 0 0 12px rgba(0,230,118,0); }
        }

        #btn-hamburger { display: none; background: none; border: none; color: var(--power-gold); font-size: 22px; cursor: pointer; padding: 4px 8px; flex-shrink: 0; }
        .drawer-overlay, .drawer { display: none; }
        .erro { color: var(--power-red); }

        /* ============ INSTALL BANNER ============ */
        #install-banner {
            display: none;
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: linear-gradient(135deg, #0d0d2b, #1a0a2e);
            border-top: 2px solid var(--power-gold);
            padding: 14px 20px;
            padding-bottom: max(14px, env(safe-area-inset-bottom));
            z-index: 1000;
            align-items: center;
            gap: 12px;
            box-shadow: 0 -4px 20px rgba(255,215,0,0.15);
        }
        #install-banner.mostrar { display: flex; }
        #install-banner .install-text {
            flex: 1;
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            letter-spacing: 0.08em;
            color: #e8e8f0;
            text-transform: uppercase;
        }
        #install-banner .install-text span {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: var(--power-gold);
            margin-bottom: 2px;
        }
        #install-btn {
            background: linear-gradient(135deg, var(--power-gold), #b8860b);
            color: #0a0a1a;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.3s;
        }
        #install-btn:hover { box-shadow: 0 0 16px rgba(255,215,0,0.4); transform: translateY(-1px); }
        #install-dismiss {
            background: none;
            border: 1px solid rgba(255,215,0,0.2);
            color: var(--power-gold);
            width: 32px; height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            transition: all 0.3s;
        }
        #install-dismiss:hover { border-color: var(--power-gold); background: rgba(255,215,0,0.1); }

        @media (max-width: 600px) {
            #install-banner { padding: 10px 14px; }
            #install-banner .install-text { font-size: 9px; }
            #install-banner .install-text span { font-size: 11px; }
            #install-btn { padding: 8px 14px; font-size: 9px; }
        }
        /* ============ MOBILE ============ */
        @media (max-width: 600px) {
            header { padding: 8px 10px; padding-top: max(8px, env(safe-area-inset-top)); gap: 8px; flex-wrap: nowrap; }
            .logo-bolt { width: 28px; height: 28px; }
            .logo-bolt svg { width: 24px; height: 24px; }
            header h1 { font-size: 13px; letter-spacing: 0.06em; }
            header > a[href="viewer3d.html"] { display: none; }
            .header-tag { display: none; }
            #btn-hamburger { display: flex !important; font-size: 20px; padding: 2px 6px; }
            #robot-list { display: none !important; }
            #main #face-panel { display: none !important; }
            #main { flex-direction: column; }
            #main > #chat { width: 100% !important; }
            .msg { max-width: 85%; }
            #chat { padding: 16px 12px; gap: 10px; }
            footer { gap: 8px; padding: 10px 10px; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
            #voz-toggle { display: none !important; }
            #microfone { display: flex !important; width: 42px; height: 42px; }
            #input { font-size: 16px; flex: 1; min-width: 0; padding: 10px 14px; }
            #enviar { padding: 10px 14px; font-size: 10px; }
            .drawer-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 998; }
            .drawer-overlay.aberto { display: block; }
            .drawer {
                position: fixed; left: -280px; top: 0; bottom: 0; width: 280px;
                background: linear-gradient(180deg, #0d0d2b, #0a0a1a);
                z-index: 999; display: flex; flex-direction: column;
                transition: left 0.3s ease; overflow-y: auto;
                border-right: 2px solid var(--power-gold);
            }
            .drawer.aberto { left: 0; }
            .drawer-header {
                display: flex; align-items: center; gap: 10px;
                padding: 14px 16px;
                border-bottom: 1px solid rgba(255,215,0,0.15);
            }
            .drawer-header h2 {
                font-family: 'Orbitron', sans-serif;
                font-size: 13px; font-weight: 700; letter-spacing: 0.08em;
                color: var(--power-gold);
            }
            .drawer-robot-list { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 16px; }
            .drawer-robot-list button {
                padding: 6px 12px; border-radius: 3px;
                border: 1px solid rgba(255,215,0,0.12);
                background: rgba(255,215,0,0.04);
                color: #c0c0d0; font-family: 'Orbitron', sans-serif;
                font-size: 9px; font-weight: 600; letter-spacing: 0.06em;
                text-transform: uppercase; cursor: pointer;
                flex-shrink: 0; min-height: 30px; transition: all 0.2s;
            }
            .drawer-robot-list button.ativo {
                background: var(--cor-robot); border-color: var(--cor-robot);
                color: #fff;
                box-shadow: 0 0 12px color-mix(in srgb, var(--cor-robot) 40%, transparent);
            }
            .drawer-secao { flex: 0 0 100%; }
            .drawer-secao-titulo {
                font-family: 'Orbitron', sans-serif;
                font-size: 9px; font-weight: 700; letter-spacing: 0.12em;
                text-transform: uppercase; color: var(--power-gold); opacity: 0.5;
                padding: 12px 0 6px; border-bottom: 1px solid rgba(255,215,0,0.08); margin-bottom: 8px;
            }
            .drawer-secao-grupo { display: flex; flex-wrap: wrap; gap: 8px; padding-bottom: 6px; }
            .drawer-secao + .drawer-secao { border-top: 1px solid rgba(255,215,0,0.06); margin-top: 4px; }
        }

        /* ============ LIGHTNING EFFECT ============ */
        .lightning-flash {
            position: fixed; inset: 0;
            background: rgba(255,215,0,0.05);
            pointer-events: none;
            opacity: 0;
            animation: lightningFlash 6s ease-in-out infinite;
            z-index: 9999;
        }
        @keyframes lightningFlash {
            0%,94%,96%,98%,100% { opacity: 0; }
            95% { opacity: 1; }
            97% { opacity: 0.5; }
        }

        /* ============ SPLASH SCREEN ============ */
        #splash {
            position: fixed; inset: 0;
            background: #0a0a1a;
            z-index: 99999;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            transition: opacity 0.8s ease, visibility 0.8s;
            overflow: hidden;
        }
        #splash.hide { opacity: 0; visibility: hidden; pointer-events: none; }
        #splash::before {
            content: '';
            position: absolute; inset: 0;
            background:
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: gridScroll 4s linear infinite;
            opacity: 0.5;
        }
        #splash::after {
            content: '';
            position: absolute;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(255,215,0,0.08) 0%, transparent 70%);
            animation: splashPulse 2s ease-in-out infinite;
        }
        @keyframes splashPulse {
            0%,100% { transform: scale(0.8); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 1; }
        }

        .splash-content {
            position: relative; z-index: 2;
            display: flex; flex-direction: column;
            align-items: center; gap: 20px;
        }

        .splash-bolt {
            width: 120px; height: 120px;
            animation: boltAppear 1s ease-out forwards, boltFloat 2s ease-in-out 1s infinite;
            opacity: 0;
            filter: drop-shadow(0 0 20px rgba(255,215,0,0.6));
        }
        @keyframes boltAppear {
            0% { opacity: 0; transform: scale(0.3) rotate(-30deg); }
            60% { opacity: 1; transform: scale(1.1) rotate(5deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }
        @keyframes boltFloat {
            0%,100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-10px) scale(1.05); }
        }

        .splash-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px; font-weight: 900;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            background: linear-gradient(135deg, var(--power-gold), #fff, var(--power-gold));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: titleSlide 0.8s ease-out 0.4s forwards;
            opacity: 0; transform: translateY(20px);
        }
        @keyframes titleSlide {
            to { opacity: 1; transform: translateY(0); }
        }

        .splash-subtitle {
            font-family: 'Orbitron', sans-serif;
            font-size: 10px; letter-spacing: 0.2em;
            color: var(--power-gold); opacity: 0;
            text-transform: uppercase;
            animation: titleSlide 0.6s ease-out 0.8s forwards;
        }

        .splash-ring {
            position: absolute;
            width: 200px; height: 200px;
            border: 2px solid var(--power-gold);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            animation: ringExpand 1.5s ease-out 0.2s forwards;
            opacity: 0;
        }
        .splash-ring:nth-child(2) { animation-delay: 0.5s; width: 300px; height: 300px; }
        .splash-ring:nth-child(3) { animation-delay: 0.8s; width: 400px; height: 400px; }
        @keyframes ringExpand {
            0% { opacity: 0; transform: scale(0.5) rotate(0deg); }
            50% { opacity: 0.4; }
            100% { opacity: 0; transform: scale(1.5) rotate(60deg); }
        }

        .splash-bar-container {
            position: absolute;
            bottom: 60px; left: 50%; transform: translateX(-50%);
            width: 200px; height: 3px;
            background: rgba(255,215,0,0.1);
            border-radius: 2px;
            overflow: hidden;
            z-index: 2;
        }
        .splash-bar {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, var(--power-gold), var(--power-red));
            border-radius: 2px;
            animation: barFill 2s ease-in-out forwards;
        }
        @keyframes barFill {
            0% { width: 0%; }
            30% { width: 40%; }
            60% { width: 70%; }
            90% { width: 95%; }
            100% { width: 100%; }
        }

        .splash-version {
            position: absolute;
            bottom: 30px; left: 50%; transform: translateX(-50%);
            font-family: 'Orbitron', sans-serif;
            font-size: 8px; letter-spacing: 0.15em;
            color: rgba(255,215,0,0.3);
            text-transform: uppercase;
            z-index: 2;
        }

        /* Flash effect */
        .splash-flash {
            position: absolute; inset: 0;
            background: var(--power-gold);
            opacity: 0;
            z-index: 10;
            animation: splashBolt 0.3s ease-out 0.6s forwards;
            pointer-events: none;
        }
        @keyframes splashBolt {
            0% { opacity: 0; }
            20% { opacity: 0.3; }
            100% { opacity: 0; }
        }

        @media (max-width: 600px) {
            .splash-bolt { width: 80px; height: 80px; }
            .splash-title { font-size: 20px; }
            .splash-ring { width: 150px; height: 150px; }
            .splash-ring:nth-child(2) { width: 220px; height: 220px; }
            .splash-ring:nth-child(3) { width: 300px; height: 300px; }
        }
    </style>
</head>
<body>
    <!-- SPLASH SCREEN -->
    <div id="splash">
        <div class="splash-flash"></div>
        <div class="splash-ring"></div>
        <div class="splash-ring"></div>
        <div class="splash-ring"></div>
        <div class="splash-content">
            <svg class="splash-bolt" viewBox="0 0 24 24" fill="none">
                <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" fill="url(#splashBoltGrad)" stroke="var(--power-gold)" stroke-width="0.3"/>
                <defs><linearGradient id="splashBoltGrad" x1="3" y1="2" x2="22" y2="22"><stop offset="0%" stop-color="var(--power-gold)"/><stop offset="100%" stop-color="var(--power-red)"/></linearGradient></defs>

        <div class="logo-bolt">

                <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" fill="url(#boltGrad)" stroke="var(--power-gold)" stroke-width="0.5"/>
                <defs><linearGradient id="boltGrad" x1="3" y1="2" x2="22" y2="22"><stop offset="0%" stop-color="var(--power-gold)"/><stop offset="100%" stop-color="var(--power-red)"/></linearGradient></defs>
            </svg>
        </div>
        <div>
            <h1>Primal Force IA</h1>
        </div>
        <a href="viewer3d.html" style="font-family:'Orbitron',sans-serif;font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:var(--power-gold);text-decoration:none;padding:6px 12px;border:1px solid rgba(255,215,0,0.2);border-radius:3px;background:rgba(255,215,0,0.04);transition:all 0.3s;flex-shrink:0;" onmouseover="this.style.borderColor='var(--power-gold)';this.style.boxShadow='0 0 12px rgba(255,215,0,0.2)'" onmouseout="this.style.borderColor='rgba(255,215,0,0.2)';this.style.boxShadow='none'">🏛️ MODELOS 3D</a>

                <svg viewBox="0 0 24 24" fill="none" width="24" height="24">

                </svg>
            </div>

        </div>
        <a href="viewer3d.html" style="display:block;margin:0 16px;padding:10px 16px;font-family:'Orbitron',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--power-gold);text-decoration:none;border:1px solid rgba(255,215,0,0.2);border-radius:4px;background:rgba(255,215,0,0.06);text-align:center;">🏛️ Modelos 3D</a>
        <div class="drawer-robot-list" id="drawer-robot-list"></div>
    </div>

    <div id="main">
        <div id="face-panel">
            <div class="morphin-badge">
                <div class="ring"></div>
                <div class="robot-avatar" id="robot-avatar">?</div>
            </div>
            <div class="robot-info">
                <div class="robot-nome" id="robot-nome">—</div>
                <div class="robot-ranger" id="robot-ranger">Companheiro de —</div>
                <div class="robot-suporte" id="robot-suporte">—</div>

    <footer>

    <script src="config.js"></script>
    <script src="primalforce-robots.js"></script>
    <script src="robot-base.js"></script>
    <script src="rex-ai.js"></script>
    <script src="spike-ai.js"></script>
    <script src="tri-ai.js"></script>
    <script src="pluma-ai.js"></script>
    <script src="nuck-ai.js"></script>
    <script src="bolha-ai.js"></script>
    <script src="anka-ai.js"></script>
    <script src="crista-ai.js"></script>
    <script src="blitz-ai.js"></script>
    <script src="testa-ai.js"></script>
    <script src="mare-ai.js"></script>
    <script src="garra-ai.js"></script>
    <script src="brisa-ai.js"></script>
    <script src="vela-ai.js"></script>
    <script src="fin-ai.js"></script>
    <script src="ninho-ai.js"></script>
    <script src="sol-ai.js"></script>
    <script src="frill-ai.js"></script>
    <script src="abismo-ai.js"></script>
    <script src="alado-ai.js"></script>
    <script>
        const robots = { rex, spike, tri, pluma, nuck, bolha, anka, crista, blitz, testa, mare, garra, brisa, vela, fin, ninho, sol, frill, abismo, alado };
        Object.values(robots).forEach((r) => { r.primalForce = PRIMAL_FORCE; });

        var atual = "rex";
        let estado = "espera";

        const chat = document.getElementById("chat");
        const input = document.getElementById("input");
        const enviar = document.getElementById("enviar");

        function construirHeader() {
            const lista = document.getElementById("robot-list");
            lista.innerHTML = "";

            const sep1 = document.createElement("span");
            sep1.className = "secao-titulo";
            sep1.textContent = "PRINCIPAIS";
            lista.appendChild(sep1);

            RANGERS_PRINCIPAIS.forEach(id => {
                const r = PRIMAL_FORCE[id];
                const btn = document.createElement("button");
                btn.dataset.robot = id;
                btn.style.setProperty("--cor-robot", r.cor);
                btn.innerHTML = `<span>${r.nome}</span>`;
                if (id === atual) btn.classList.add("ativo");
                btn.addEventListener("click", () => selecionarRobot(id));
                lista.appendChild(btn);
            });

            const sep2 = document.createElement("span");
            sep2.className = "secao-titulo";
            sep2.textContent = "OUTROS";
            lista.appendChild(sep2);

            OUTROS_RANGERS.forEach(id => {
                const r = PRIMAL_FORCE[id];
                const btn = document.createElement("button");
                btn.dataset.robot = id;
                btn.style.setProperty("--cor-robot", r.cor);
                btn.innerHTML = `<span>${r.nome}</span>`;
                if (id === atual) btn.classList.add("ativo");
                btn.addEventListener("click", () => selecionarRobot(id));
                lista.appendChild(btn);
            });
        }

        function construirDrawer() {
            const lista = document.getElementById("drawer-robot-list");
            lista.innerHTML = "";

            const sec1 = document.createElement("div");
            sec1.className = "drawer-secao";
            const tit1 = document.createElement("div");
            tit1.className = "drawer-secao-titulo";
            tit1.textContent = "Rangers Principais";
            const grp1 = document.createElement("div");
            grp1.className = "drawer-secao-grupo";
            RANGERS_PRINCIPAIS.forEach(id => {
                const r = PRIMAL_FORCE[id];
                const btn = document.createElement("button");
                btn.dataset.robot = id;
                btn.style.setProperty("--cor-robot", r.cor);
                btn.textContent = r.nome;
                if (id === atual) btn.classList.add("ativo");
                btn.addEventListener("click", () => { selecionarRobot(id); fecharDrawer(); });
                grp1.appendChild(btn);
            });
            sec1.appendChild(tit1); sec1.appendChild(grp1); lista.appendChild(sec1);

            const sec2 = document.createElement("div");
            sec2.className = "drawer-secao";
            const tit2 = document.createElement("div");
            tit2.className = "drawer-secao-titulo";
            tit2.textContent = "Outros Rangers";
            const grp2 = document.createElement("div");
            grp2.className = "drawer-secao-grupo";
            OUTROS_RANGERS.forEach(id => {
                const r = PRIMAL_FORCE[id];
                const btn = document.createElement("button");
                btn.dataset.robot = id;
                btn.style.setProperty("--cor-robot", r.cor);
                btn.textContent = r.nome;
                if (id === atual) btn.classList.add("ativo");
                btn.addEventListener("click", () => { selecionarRobot(id); fecharDrawer(); });
                grp2.appendChild(btn);
            });
            sec2.appendChild(tit2); sec2.appendChild(grp2); lista.appendChild(sec2);
        }

        function selecionarRobot(id) {
            atual = id;
            const r = PRIMAL_FORCE[id];

            document.querySelectorAll('#robot-list button').forEach(b => {
                b.classList.toggle("ativo", b.dataset.robot === id);
            });
            document.querySelectorAll('#drawer-robot-list button').forEach(b => {
                b.classList.toggle("ativo", b.dataset.robot === id);
            });

            const avatar = document.getElementById("robot-avatar");
            avatar.style.background = `linear-gradient(135deg, ${r.cor}, color-mix(in srgb, ${r.cor} 60%, #000))`;
            if (r.imagem) {
                avatar.innerHTML = `<img src="${r.imagem}" alt="${r.nome}">`;
            } else {
                avatar.textContent = r.nome[0];
            }

            document.getElementById("robot-nome").textContent = r.nome;
            document.getElementById("robot-nome").style.color = r.cor;
            document.getElementById("robot-ranger").textContent = `Companheiro do ${r.ranger}`;
            document.getElementById("robot-suporte").textContent = `${r.suporte.toUpperCase()} • ${r.dino}`;
            document.getElementById("robot-suporte").style.color = r.cor;
            document.getElementById("robot-suporte").style.borderColor = `color-mix(in srgb, ${r.cor} 30%, transparent)`;

            document.documentElement.style.setProperty("--robot-cor", r.cor);
            input.placeholder = `Fala com ${r.nome}...`;

            chat.innerHTML = "";
            adicionarMensagem("robot", r.frase, r.cor);
        }

        function definirEstado(novoEstado) {
            estado = novoEstado;
            const textos = { "espera": "À espera...", "ouvir": "A ouvir...", "pensar": "A pensar...", "falar": "A falar..." };
            document.querySelectorAll(".estado-label").forEach(l => {
                l.textContent = textos[novoEstado];
                l.style.color = PRIMAL_FORCE[atual].cor;
            });
            document.getElementById("face-panel").setAttribute("data-estado", novoEstado);
        }

        function adicionarMensagem(quem, texto, cor) {
            const div = document.createElement("div");
            div.className = "msg " + quem;
            if (quem === "robot") {
                const r = PRIMAL_FORCE[atual];
                const linha = document.createElement("div");
                linha.className = "linha-robot";
                const avatarMini = document.createElement("div");
                avatarMini.className = "avatar-mini";
                avatarMini.style.background = cor || r.cor;
                if (r.imagem) {
                    avatarMini.innerHTML = `<img src="${r.imagem}" alt="${r.nome}">`;
                } else {
                    avatarMini.textContent = r.nome[0];
                }
                const nomeEl = document.createElement("div");
                nomeEl.className = "nome-robot";
                nomeEl.textContent = r.nome;
                nomeEl.style.color = cor || r.cor;
                linha.appendChild(avatarMini);
                linha.appendChild(nomeEl);
                div.appendChild(linha);
            }
            div.appendChild(document.createTextNode(texto));
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function adicionarSistema(texto) {
            const div = document.createElement("div");
            div.className = "msg sistema";
            div.textContent = texto;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }
        window.adicionarSistema = adicionarSistema;

        function mostrarDigitando() {
            const div = document.createElement("div");
            div.className = "digitando";
            const span = document.createElement("span");
            span.textContent = PRIMAL_FORCE[atual].nome;
            div.appendChild(span);
            div.appendChild(document.createTextNode(" está a pensar..."));
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            return div;
        }

        async function enviarMensagem() {
            const texto = input.value.trim();
            if (!texto || estado === "pensar") return;

            input.value = "";
            adicionarMensagem("user", texto);
            definirEstado("pensar");
            const digitando = mostrarDigitando();

            try {
                const robot = robots[atual];
                const resposta = await robot.responde(texto);
                digitando.remove();
                definirEstado("falar");
                adicionarMensagem("robot", resposta, PRIMAL_FORCE[atual].cor);
                await robot.falar(resposta);
                definirEstado("espera");
            } catch (e) {
                digitando.remove();
                adicionarSistema("⚠️ Erro: " + e.message);
                definirEstado("espera");
            }
        }

        enviar.addEventListener("click", enviarMensagem);
        input.addEventListener("keydown", (e) => { if (e.key === "Enter") enviarMensagem(); });

        const vozToggle = document.getElementById("voz-toggle");
        vozToggle.addEventListener("click", () => {
            CONFIG.vozAtivada = !CONFIG.vozAtivada;
            vozToggle.textContent = CONFIG.vozAtivada ? "🔊" : "🔇";
            vozToggle.classList.toggle("desligado", !CONFIG.vozAtivada);
        });

        const microfone = document.getElementById("microfone");
        let reconhecimento = null;
        if ("SpeechRecognition" in window || "webkitSpeechRecognition" in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            reconhecimento = new SpeechRecognition();
            reconhecimento.lang = "pt-PT";
            reconhecimento.continuous = false;
            reconhecimento.interimResults = false;
            reconhecimento.onresult = (e) => {
                const texto = e.results[0][0].transcript;
                input.value = texto;
                enviarMensagem();
                microfone.classList.remove("ouvindo");
            };
            reconhecimento.onerror = () => microfone.classList.remove("ouvindo");
            reconhecimento.onend = () => microfone.classList.remove("ouvindo");
        }
        microfone.addEventListener("click", () => {
            if (!reconhecimento) { adicionarSistema("🎤 Reconhecimento de voz não disponível neste navegador."); return; }
            microfone.classList.toggle("ouvindo");
            if (microfone.classList.contains("ouvindo")) {
                reconhecimento.start();
                definirEstado("ouvir");
            } else {
                reconhecimento.stop();
                definirEstado("espera");
            }
        });

        const hamburger = document.getElementById("btn-hamburger");
        const drawerOverlay = document.getElementById("drawer-overlay");
        hamburger.addEventListener("click", () => {
            document.getElementById("drawer").classList.add("aberto");
            drawerOverlay.classList.add("aberto");
        });
        drawerOverlay.addEventListener("click", fecharDrawer);
        function fecharDrawer() {
            document.getElementById("drawer").classList.remove("aberto");
            drawerOverlay.classList.remove("aberto");
        }

        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("sw.js", { updateViaCache: 'none' }).catch(e => {
                console.warn("Erro ao registar service worker:", e);
            });
        }

        function desbloquearAudio() {
            if (!window._audioCtx) {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                window._audioCtx = new AudioCtx();
            }
            if (window._audioCtx.state === "suspended") {
                window._audioCtx.resume().catch(() => {});
            }
        }
        ["touchstart", "click", "keydown"].forEach((ev) => {
            document.addEventListener(ev, desbloquearAudio, { once: true });
            document.addEventListener(ev, desbloquearAudio);
        });

        construirHeader();
        construirDrawer();
        selecionarRobot("rex");

        // ============ PWA INSTALL PROMPT ============
        let deferredPrompt = null;
        const installBanner = document.getElementById('install-banner');
        const installBtn = document.getElementById('install-btn');
        const installDismiss = document.getElementById('install-dismiss');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBanner.classList.add('mostrar');
        });

        installBtn.addEventListener('click', async () => {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            console.log('Install outcome:', outcome);
            deferredPrompt = null;
            installBanner.classList.remove('mostrar');
        });

        installDismiss.addEventListener('click', () => {
            installBanner.classList.remove('mostrar');
            sessionStorage.setItem('installDismissed', '1');
        });

        // Hide if already dismissed this session
        if (sessionStorage.getItem('installDismissed')) {
            installBanner.classList.remove('mostrar');
        }

        window.addEventListener('appinstalled', () => {
            installBanner.classList.remove('mostrar');
            deferredPrompt = null;
        });

        // ============ SPLASH SCREEN ============
        function hideSplash() {
            const splash = document.getElementById('splash');
            if (splash) {
                splash.classList.add('hide');
                setTimeout(() => splash.remove(), 1000);
            }
        }
        // Hide after 2.5s or when fonts + images load, whichever is first
        setTimeout(hideSplash, 2500);
        document.fonts.ready.then(() => {
            if (document.getElementById('splash')) setTimeout(hideSplash, 800);
        });
    </script>
</body>
</html>
